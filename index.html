<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>JMCFI-MealHub</title>
 <style>
:root {
--primary: #4F003B;
--primary-dark: #360028;
--primary-light: #F9EDF6;
--primary-border: #E5C7DD;
--white: #FFFFFF;
--bg: #F5F5F5;
--text-main: #231822;
--text-secondary: #7A6C77;
--border: #EAE4E9;
--success: #16A34A;
--success-bg: #ECFDF3;
--warning: #D97706;
--warning-bg: #FFFBEB;
--danger: #DC2626;
--danger-bg: #FEF2F2;
--shadow-sm: 0 1px 2px rgba(37, 34, 56, 0.05);
--shadow-md: 0 4px 14px rgba(37, 34, 56, 0.06);
--shadow-lg: 0 12px 32px rgba(37, 34, 56, 0.12);
--radius-sm: 8px;
--radius-md: 12px;
--radius-lg: 16px;
--sidebar-width: 256px;
--header-height: 68px;
}
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial, sans-serif;
background-color: var(--bg);
color: var(--text-main);
line-height: 1.5;
font-size: 14px;
-webkit-font-smoothing: antialiased;
}
button,
input,
select,
textarea {
font-family: inherit;
font-size: inherit;
color: inherit;
}
button {
cursor: pointer;
border: none;
background: none;
}
.hidden {
display: none !important;
}
.btn {
display: inline-flex;
align-items: center;
justify-content: center;
gap: 8px;
padding: 9px 16px;
border-radius: var(--radius-sm);
font-weight: 500;
font-size: 13.5px;
transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease;
white-space: nowrap;
}
.btn-primary {
background-color: var(--primary);
color: var(--white);
}
.btn-primary:hover:not(:disabled) {
background-color: var(--primary-dark);
}
.btn-secondary {
background-color: var(--white);
color: var(--text-main);
border: 1px solid var(--border);
}
.btn-secondary:hover:not(:disabled) {
background-color: var(--primary-light);
border-color: var(--primary-border);
color: var(--primary-dark);
}
.btn-ghost {
background-color: transparent;
color: var(--text-secondary);
}
.btn-ghost:hover:not(:disabled) {
background-color: var(--primary-light);
color: var(--primary);
}
.btn-danger-outline {
background-color: var(--white);
color: var(--danger);
border: 1px solid #FECACA;
}
.btn-danger-outline:hover:not(:disabled) {
background-color: var(--danger-bg);
}
.btn-sm {
padding: 6px 12px;
font-size: 12.5px;
}
.btn-lg {
padding: 11px 20px;
font-size: 14.5px;
}
.btn:disabled {
opacity: 0.5;
cursor: not-allowed;
}
.input-control,
.select-control {
width: 100%;
padding: 9px 12px;
border: 1px solid var(--border);
border-radius: var(--radius-sm);
background-color: var(--white);
color: var(--text-main);
outline: none;
transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.input-control:focus,
.select-control:focus {
border-color: var(--primary);
box-shadow: 0 0 0 3px rgba(79, 0, 59, 0.12);
}
.input-control::placeholder {
color: var(--text-secondary);
}
.badge {
display: inline-flex;
align-items: center;
gap: 5px;
padding: 3px 10px;
border-radius: 999px;
font-size: 12px;
font-weight: 500;
white-space: nowrap;
}
.badge-purple {
background-color: var(--primary-light);
color: var(--primary-dark);
}
.badge-success {
background-color: var(--success-bg);
color: var(--success);
}
.badge-warning {
background-color: var(--warning-bg);
color: var(--warning);
}
.badge-danger {
background-color: var(--danger-bg);
color: var(--danger);
}
.badge-neutral {
background-color: #F3F2F8;
color: var(--text-secondary);
}
.login-wrapper {
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
padding: 24px;
background-color: var(--bg);
}
.login-card {
width: 100%;
max-width: 420px;
background-color: var(--white);
border: 1px solid var(--border);
border-radius: var(--radius-lg);
box-shadow: var(--shadow-md);
padding: 36px 32px;
}
.login-brand {
display: flex;
flex-direction: column;
align-items: center;
text-align: center;
margin-bottom: 28px;
}
.login-logo {
min-width: 76px;
height: 52px;
padding: 0 18px;
border-radius: 12px;
background-color: var(--primary-light);
color: var(--primary);
display: flex;
align-items: center;
justify-content: center;
margin-bottom: 14px;
border: 1px dashed var(--primary-border);
font-size: 13px;
font-weight: 700;
letter-spacing: 0.1em;
text-transform: uppercase;
}
.login-title {
font-size: 20px;
font-weight: 700;
color: var(--text-main);
letter-spacing: -0.01em;
}
.login-subtitle {
font-size: 13px;
color: var(--text-secondary);
margin-top: 4px;
}
.form-group {
margin-bottom: 16px;
}
.form-label {
display: block;
font-size: 13px;
font-weight: 500;
color: var(--text-main);
margin-bottom: 6px;
}
.password-wrap {
position: relative;
display: flex;
align-items: center;
}
.password-wrap .input-control {
padding-right: 42px;
}
.password-toggle {
position: absolute;
right: 10px;
color: var(--text-secondary);
display: flex;
align-items: center;
justify-content: center;
padding: 4px;
border-radius: 6px;
}
.password-toggle:hover {
color: var(--primary);
background-color: var(--primary-light);
}
.login-options {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 22px;
font-size: 13px;
}
.checkbox-label {
display: inline-flex;
align-items: center;
gap: 8px;
color: var(--text-main);
cursor: pointer;
}
.checkbox-label input[type="checkbox"] {
accent-color: var(--primary);
width: 15px;
height: 15px;
cursor: pointer;
}
.link-btn {
color: var(--primary);
font-weight: 500;
font-size: 13px;
}
.link-btn:hover {
color: var(--primary-dark);
text-decoration: underline;
}
.auth-switch {
margin-top: 20px;
padding-top: 16px;
border-top: 1px solid var(--border);
text-align: center;
font-size: 13px;
color: var(--text-secondary);
}
.login-error {
margin-bottom: 14px;
padding: 10px 12px;
border-radius: var(--radius-sm);
background-color: var(--danger-bg);
color: var(--danger);
font-size: 13px;
border: 1px solid #FECACA;
}
.login-success {
margin-bottom: 14px;
padding: 10px 12px;
border-radius: var(--radius-sm);
background-color: var(--success-bg);
color: var(--success);
font-size: 13px;
border: 1px solid #BBF7D0;
}
.app-shell {
display: flex;
min-height: 100vh;
}
.sidebar {
width: var(--sidebar-width);
background-color: var(--white);
border-right: 1px solid var(--border);
position: fixed;
top: 0;
left: 0;
bottom: 0;
display: flex;
flex-direction: column;
z-index: 40;
transition: transform 0.2s ease;
}
.sidebar-header {
height: var(--header-height);
padding: 0 20px;
display: flex;
align-items: center;
gap: 12px;
border-bottom: 1px solid var(--border);
flex-shrink: 0;
}
.sidebar-logo {
min-width: 44px;
height: 34px;
padding: 0 8px;
border-radius: 8px;
background-color: var(--primary);
color: var(--white);
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
font-size: 10px;
font-weight: 700;
letter-spacing: 0.08em;
}
.sidebar-brand-name {
font-size: 15px;
font-weight: 700;
color: var(--text-main);
line-height: 1.2;
}
.sidebar-brand-sub {
font-size: 11px;
color: var(--text-secondary);
}
.sidebar-nav {
flex: 1;
overflow-y: auto;
padding: 14px 12px;
display: flex;
flex-direction: column;
gap: 3px;
}
.nav-section-label {
font-size: 11px;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 0.05em;
color: var(--text-secondary);
padding: 10px 12px 4px;
}
.nav-item {
width: 100%;
display: flex;
align-items: center;
gap: 11px;
padding: 9px 12px;
border-radius: var(--radius-sm);
color: var(--text-secondary);
font-weight: 500;
font-size: 13.5px;
text-align: left;
transition: background-color 0.15s ease, color 0.15s ease;
}
.nav-item svg {
width: 18px;
height: 18px;
flex-shrink: 0;
}
.nav-item:hover {
background-color: var(--bg);
color: var(--text-main);
}
.nav-item.active {
background-color: var(--primary-light);
color: var(--primary);
font-weight: 600;
}
.nav-sub-group {
padding-left: 28px;
margin: 2px 0 6px;
display: flex;
flex-direction: column;
gap: 2px;
}
.nav-sub-item {
padding: 6px 10px;
font-size: 12px;
font-weight: 500;
color: var(--text-secondary);
border-radius: var(--radius-sm);
text-align: left;
transition: all 0.15s ease;
display: flex;
align-items: center;
gap: 6px;
background: none;
border: none;
cursor: pointer;
}
.nav-sub-item:hover {
color: var(--primary);
background-color: var(--primary-light);
}
.nav-sub-item.active {
color: var(--primary-dark);
font-weight: 700;
background-color: var(--primary-light);
}
.nav-expand-btn {
font-size: 12px;
font-weight: 600;
color: var(--primary);
background-color: #FAF4F8;
border: 1px dashed var(--primary-border);
border-radius: var(--radius-sm);
margin-top: 4px;
padding: 7px 12px;
display: flex;
align-items: center;
gap: 8px;
cursor: pointer;
}
.nav-expand-btn:hover {
background-color: var(--primary-light);
color: var(--primary-dark);
border-color: var(--primary);
}
.nav-group {
display: flex;
flex-direction: column;
margin-top: 2px;
}
.nav-group-toggle {
width: 100%;
display: flex;
align-items: center;
justify-content: space-between;
gap: 8px;
padding: 8.5px 12px;
border-radius: var(--radius-sm);
color: var(--text-secondary);
font-size: 13px;
font-weight: 600;
text-align: left;
background: transparent;
border: none;
cursor: pointer;
transition: background-color 0.18s ease, color 0.18s ease;
}
.nav-group-toggle:hover {
background-color: var(--bg);
color: var(--text-main);
}
.nav-group.has-active .nav-group-toggle {
color: var(--primary-dark);
font-weight: 700;
}
.nav-group-toggle-left {
display: flex;
align-items: center;
gap: 9px;
min-width: 0;
}
.nav-group-bar {
width: 3px;
height: 14px;
border-radius: 2px;
background-color: #DCD2DA;
flex-shrink: 0;
transition: background-color 0.2s ease;
}
.nav-group.expanded .nav-group-bar,
.nav-group.has-active .nav-group-bar {
background-color: var(--primary);
}
.nav-group-chevron {
width: 15px;
height: 15px;
flex-shrink: 0;
color: var(--text-muted);
transition: transform 0.24s cubic-bezier(0.4, 0, 0.2, 1), color 0.18s ease;
}
.nav-group.expanded .nav-group-chevron {
transform: rotate(90deg);
color: var(--primary);
}
.nav-group-collapse {
display: grid;
grid-template-rows: 0fr;
opacity: 0;
transition: grid-template-rows 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
}
.nav-group.expanded .nav-group-collapse {
grid-template-rows: 1fr;
opacity: 1;
}
.nav-group-items {
overflow: hidden;
display: flex;
flex-direction: column;
gap: 2px;
padding-left: 10px;
margin-left: 13px;
border-left: 1.5px solid #EAE0E7;
}
.nav-group.expanded .nav-group-items {
padding-top: 2px;
padding-bottom: 5px;
}
.nav-group-items .nav-item {
padding: 7.5px 10px;
font-size: 13px;
gap: 9px;
}
.nav-group-items .nav-item svg {
width: 16px;
height: 16px;
}
.sidebar-footer {
padding: 12px;
border-top: 1px solid var(--border);
flex-shrink: 0;
}
.nav-item.logout-btn {
color: var(--danger);
}
.nav-item.logout-btn:hover {
background-color: var(--danger-bg);
color: var(--danger);
}
.sidebar-backdrop {
display: none;
position: fixed;
inset: 0;
background-color: rgba(37, 34, 56, 0.35);
z-index: 35;
}
.main-wrapper {
flex: 1;
margin-left: var(--sidebar-width);
display: flex;
flex-direction: column;
min-width: 0;
}
.topbar {
height: var(--header-height);
background-color: var(--white);
border-bottom: 1px solid var(--border);
padding: 0 28px;
display: flex;
align-items: center;
justify-content: space-between;
gap: 16px;
position: sticky;
top: 0;
z-index: 30;
}
.topbar-left {
display: flex;
align-items: center;
gap: 14px;
min-width: 0;
}
.mobile-menu-btn {
display: none;
padding: 8px;
border-radius: var(--radius-sm);
color: var(--text-main);
border: 1px solid var(--border);
}
.topbar-title-group h1 {
font-size: 18px;
font-weight: 700;
color: var(--text-main);
line-height: 1.25;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.topbar-date {
font-size: 12.5px;
color: var(--text-secondary);
}
.topbar-right {
display: flex;
align-items: center;
gap: 12px;
}
.dropdown-container {
position: relative;
}
.icon-btn {
width: 40px;
height: 40px;
border-radius: var(--radius-sm);
border: 1px solid var(--border);
background-color: var(--white);
color: var(--text-main);
display: flex;
align-items: center;
justify-content: center;
position: relative;
transition: background-color 0.15s ease, border-color 0.15s ease;
}
.icon-btn:hover {
background-color: var(--primary-light);
border-color: var(--primary-border);
color: var(--primary);
}
.notif-dot {
position: absolute;
top: 7px;
right: 8px;
min-width: 16px;
height: 16px;
padding: 0 4px;
border-radius: 999px;
background-color: var(--primary);
color: var(--white);
font-size: 10px;
font-weight: 700;
display: flex;
align-items: center;
justify-content: center;
border: 2px solid var(--white);
}
.profile-trigger {
display: flex;
align-items: center;
gap: 10px;
padding: 5px 10px 5px 6px;
border-radius: var(--radius-sm);
border: 1px solid var(--border);
background-color: var(--white);
transition: background-color 0.15s ease, border-color 0.15s ease;
}
.profile-trigger:hover {
background-color: var(--bg);
border-color: var(--primary-border);
}
.avatar {
width: 32px;
height: 32px;
border-radius: 8px;
background-color: var(--primary);
color: var(--white);
font-weight: 600;
font-size: 13px;
display: flex;
align-items: center;
justify-content: center;
}
.profile-info {
text-align: left;
line-height: 1.25;
}
.profile-name {
font-size: 13px;
font-weight: 600;
color: var(--text-main);
}
.profile-role {
font-size: 11px;
color: var(--text-secondary);
}
.dropdown-menu {
position: absolute;
top: calc(100% + 8px);
right: 0;
width: 300px;
background-color: var(--white);
border: 1px solid var(--border);
border-radius: var(--radius-md);
box-shadow: var(--shadow-lg);
z-index: 50;
overflow: hidden;
}
.dropdown-menu.profile-menu {
width: 220px;
}
.dropdown-header {
padding: 12px 16px;
border-bottom: 1px solid var(--border);
display: flex;
align-items: center;
justify-content: space-between;
}
.dropdown-header strong {
font-size: 13.5px;
color: var(--text-main);
}
.notif-list {
max-height: 480px;
overflow-y: auto;
}
#notif-dropdown {
width: 400px;
}
.notif-tabs {
display: flex;
gap: 6px;
padding: 8px 14px;
background-color: #FAF8FA;
border-bottom: 1px solid var(--border);
}
.notif-tab {
flex: 1;
padding: 5px 8px;
font-size: 11.5px;
font-weight: 600;
border-radius: 7px;
border: 1px solid var(--border);
background: #FFFFFF;
color: var(--text-secondary);
cursor: pointer;
transition: all 0.14s ease;
text-align: center;
white-space: nowrap;
}
.notif-tab:hover {
border-color: var(--primary);
color: var(--primary);
}
.notif-tab.active {
background: var(--primary);
border-color: var(--primary);
color: #FFFFFF;
}
.notif-section-title {
padding: 8px 16px;
font-size: 11px;
font-weight: 700;
text-transform: uppercase;
letter-spacing: 0.05em;
color: var(--primary-dark);
background-color: #F7F2F6;
border-bottom: 1px solid var(--border);
display: flex;
align-items: center;
justify-content: space-between;
}
.notif-item {
padding: 11px 16px;
border-bottom: 1px solid var(--border);
display: flex;
gap: 10px;
align-items: flex-start;
transition: background-color 0.12s ease;
cursor: pointer;
}
.notif-item:hover {
background-color: #F8F3F7;
}
.notif-item:last-child {
border-bottom: none;
}
.notif-item.unread {
background-color: #FCF7FA;
}
.notif-indicator {
width: 8px;
height: 8px;
border-radius: 50%;
margin-top: 6px;
flex-shrink: 0;
background-color: var(--primary);
}
.notif-item:not(.unread) .notif-indicator {
background-color: var(--border);
}
.notif-text {
font-size: 12.5px;
color: var(--text-main);
}
.notif-time {
font-size: 11px;
color: var(--text-secondary);
margin-top: 2px;
}
.menu-action {
width: 100%;
padding: 10px 16px;
display: flex;
align-items: center;
gap: 10px;
font-size: 13px;
color: var(--text-main);
text-align: left;
}
.menu-action:hover {
background-color: var(--bg);
color: var(--primary);
}
.menu-action.danger {
color: var(--danger);
border-top: 1px solid var(--border);
}
.menu-action.danger:hover {
background-color: var(--danger-bg);
}
.page-content {
padding: 24px 28px 36px;
flex: 1;
}
.page-header-row {
display: flex;
flex-wrap: wrap;
align-items: center;
justify-content: space-between;
gap: 14px;
margin-bottom: 20px;
}
.page-header-row h2 {
font-size: 20px;
font-weight: 700;
color: var(--text-main);
}
.page-header-row p {
font-size: 13px;
color: var(--text-secondary);
margin-top: 2px;
}
.card {
background-color: var(--white);
border: 1px solid var(--border);
border-radius: var(--radius-md);
box-shadow: var(--shadow-sm);
}
.card-header {
padding: 16px 20px;
border-bottom: 1px solid var(--border);
display: flex;
align-items: center;
justify-content: space-between;
gap: 12px;
flex-wrap: wrap;
}
.card-title {
font-size: 15px;
font-weight: 600;
color: var(--text-main);
}
.card-subtitle {
font-size: 12px;
color: var(--text-secondary);
}
.card-body {
padding: 20px;
}
.kpi-grid {
display: grid;
grid-template-columns: repeat(3, minmax(0, 1fr));
gap: 16px;
margin-bottom: 20px;
}
.kpi-card {
background-color: var(--white);
border: 1px solid var(--border);
border-radius: var(--radius-md);
box-shadow: var(--shadow-sm);
padding: 18px 20px;
display: flex;
align-items: flex-start;
justify-content: space-between;
gap: 12px;
}
.kpi-label {
font-size: 12.5px;
font-weight: 500;
color: var(--text-secondary);
margin-bottom: 6px;
}
.kpi-value {
font-size: 22px;
font-weight: 700;
color: var(--text-main);
letter-spacing: -0.02em;
}
.kpi-meta {
font-size: 12px;
color: var(--text-secondary);
margin-top: 6px;
}
.kpi-meta .up {
color: var(--success);
font-weight: 600;
}
.kpi-meta .warn {
color: var(--warning);
font-weight: 600;
}
.kpi-icon {
width: 42px;
height: 42px;
border-radius: 10px;
background-color: var(--primary-light);
color: var(--primary);
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}
.charts-grid {
display: grid;
grid-template-columns: repeat(2, minmax(0, 1fr));
gap: 18px;
margin-bottom: 20px;
}
.analytics-grid {
display: grid;
grid-template-columns: 1.1fr 1fr;
gap: 18px;
margin-bottom: 20px;
}
.bottom-grid {
display: grid;
grid-template-columns: repeat(2, minmax(0, 1fr));
gap: 18px;
}
.tab-group {
display: inline-flex;
background-color: var(--bg);
border: 1px solid var(--border);
border-radius: var(--radius-sm);
padding: 3px;
gap: 2px;
}
.tab-btn {
padding: 5px 12px;
border-radius: 6px;
font-size: 12.5px;
font-weight: 500;
color: var(--text-secondary);
}
.tab-btn.active {
background-color: var(--white);
color: var(--primary);
box-shadow: var(--shadow-sm);
}
.chart-box {
width: 100%;
overflow-x: auto;
}

 function bindAnnexGFormEvents(containerEl, draft, onAfterSubmit) {
  const scoreLabels = { 1: 'Very Poor', 2: 'Poor', 3: 'Fair', 4: 'Good', 5: 'Excellent' };
  const bind = (id, key) => {
  const el = containerEl.querySelector('#' + id);
  if (el) {
  el.addEventListener('input', (e) => { draft[key] = e.target.value; });
  el.addEventListener('change', (e) => { draft[key] = e.target.value; });
  }
  };
  bind('ang-date', 'date');
  bind('ang-cust-type', 'customerType');
  bind('ang-sender-name', 'senderName');
  bind('ang-visit-time', 'visitTime');
  bind('ang-floor', 'canteenFloor');
  bind('ang-liked', 'likedMost');
  bind('ang-improve', 'improve');
  bind('ang-suggestions', 'suggestions');

  containerEl.querySelectorAll('[data-ang-crit]').forEach((btn) => {
  btn.addEventListener('click', () => {
  const crit = btn.getAttribute('data-ang-crit');
  const score = parseInt(btn.getAttribute('data-ang-score'), 10);
  draft.ratings[crit] = score;

  const rowEl = btn.closest('.fb-rating-row') || btn.closest('tr');
  if (rowEl) {
   const lblEl = rowEl.querySelector('.fb-score-label');
   if (lblEl) {
   lblEl.innerHTML = `${score} / 5 &middot; ${scoreLabels[score] || ''}`;
   }
   rowEl.querySelectorAll('[data-ang-crit]').forEach((b) => {
   const s = parseInt(b.getAttribute('data-ang-score'), 10);
   const active = s === score;
   b.classList.toggle('active-pass', active);
   b.textContent = String(s);
   b.style.background = active ? 'var(--primary)' : '#FFFFFF';
   b.style.borderColor = active ? 'var(--primary)' : '';
   b.style.color = active ? '#FFFFFF' : '';
   b.style.fontWeight = active ? '700' : '';
   });
  }
  });
  });

  const submitBtn = containerEl.querySelector('#ang-submit-btn');
  if (submitBtn) {
  submitBtn.addEventListener('click', () => {
  const scores = ANNEX_G_CRITERIA.map((c) => Number(draft.ratings[c.id]) || 5);
  const avg = (scores.reduce((s, n) => s + n, 0) / scores.length).toFixed(1);
  const overallScore = draft.ratings.G8 || Math.round(Number(avg));
  const liked = (draft.likedMost || '').trim();
  const imp = (draft.improve || '').trim();
  const sug = (draft.suggestions || '').trim();
  const combinedComment = [liked, imp ? `Improve: ${imp}` : '', sug].filter(Boolean).join(' · ') || 'Submitted customer satisfaction rating.';

  const nextId = 'FB-' + (304 + state.feedbacks.length);
  const senderLabel = (draft.senderName || '').trim() || `Anonymous (${draft.customerType || 'Customer'})`;
  state.feedbacks.unshift({
   id: nextId,
   sender: `${senderLabel} · ${draft.canteenFloor || '4th Floor Canteen'}`,
   customerType: draft.customerType || 'Student',
   visitTime: draft.visitTime || '—',
   rating: `${overallScore}/5 (Avg ${avg})`,
   comment: combinedComment,
   likedMost: liked || '—',
   improve: imp || '—',
   suggestions: sug || '—',
   ratings: { ...draft.ratings },
   date: draft.date || 'Nov 19, 2026',
   status: 'New'
  });

  state.annexGDraft = createDefaultAnnexGDraft();
  if (onAfterSubmit) onAfterSubmit(nextId);
  });
  }
 }

 }

 // ==========================================

 // ==========================================
 function formatCurrency(val) {
  return '₱' + Number(val).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
 }

 function escapeHtml(str) {
  return String(str)
  .replace(/&/g, '&amp;')
  .replace(/</g, '&lt;')
  .replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;')
  .replace(/'/g, '&#39;');
 }

 function showToast(message, type = 'info') {
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  toastContainer.appendChild(toast);
  setTimeout(() => {
  toast.remove();
  }, 3200);
 }

 function openModal(title, bodyHtml, footerHtml, options = {}) {
  const modalCardEl = modalOverlay.querySelector('.modal-card');
  if (modalCardEl) {
  modalCardEl.classList.toggle('modal-lg', Boolean(options.large));
  }
  modalFooter.classList.toggle('modal-footer-split', Boolean(options.splitFooter));
  modalTitle.textContent = title;
  modalBody.innerHTML = bodyHtml;
  modalFooter.innerHTML = footerHtml || '';
  modalOverlay.classList.remove('hidden');
 }

 function closeModal() {
  if (state.activeQrStream) {
  state.activeQrStream.getTracks().forEach((track) => track.stop());
  state.activeQrStream = null;
  }
  const modalCardEl = modalOverlay.querySelector('.modal-card');
  if (modalCardEl) {
  modalCardEl.classList.remove('modal-lg');
  }
  modalFooter.classList.remove('modal-footer-split');
  modalOverlay.classList.add('hidden');
 }

 function getStockStatus(stock) {
  if (stock <= 0) return { label: 'Out of Stock', badgeClass: 'badge-danger' };
  if (stock <= state.canteenSettings.lowStockThreshold) return { label: `Low Stock (${stock})`, badgeClass: 'badge-warning' };
  return { label: `In Stock (${stock})`, badgeClass: 'badge-success' };
 }

 registerForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const fullName = document.getElementById('reg-fullname').value.trim();
  const username = document.getElementById('reg-username').value.trim();
  const role = 'Customer';
  const pass = document.getElementById('reg-password').value;
  const confirm = document.getElementById('reg-confirm').value;

  loginSuccess.classList.add('hidden');

  if (!fullName || !username || !pass || !confirm) {
  loginError.textContent = 'Please complete all registration fields.';
  loginError.classList.remove('hidden');
  return;
  }
  if (pass !== confirm) {
  loginError.textContent = 'Passwords do not match.';
  loginError.classList.remove('hidden');
  return;
  }

  const nextId = 'USR-' + String(state.users.length + 1).padStart(2, '0');
  state.credentials[username.toLowerCase()] = pass;
  state.userRoles[username.toLowerCase()] = 'student';
  state.users.unshift({
  id: nextId,
  name: fullName,
  email: username,
  role,
  lastActive: 'Just registered',
  status: 'Active'
  });

  loginError.classList.add('hidden');
  registerForm.reset();
  registerForm.classList.add('hidden');
  loginForm.classList.remove('hidden');
  loginUsername.value = username;
  loginPassword.value = '';
  loginSuccess.textContent = `Account registered for ${fullName}. You can now log in.`;
  loginSuccess.classList.remove('hidden');
  showToast('Registration successful!', 'success');
 });

 loginForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const userVal = loginUsername.value.trim();
  const passVal = loginPassword.value.trim();

  loginSuccess.classList.add('hidden');

  if (!userVal || !passVal) {
  loginError.textContent = 'Please enter both username/email and password.';
  loginError.classList.remove('hidden');
  return;
  }

  const key = userVal.toLowerCase();
  if (state.credentials[key] !== passVal) {
  loginError.textContent = 'Invalid username or password.';
  loginError.classList.remove('hidden');
  return;
  }

  loginError.classList.add('hidden');
  state.isAuthenticated = true;
  state.currentUserRole = state.userRoles[key] || 'admin';
  loginView.classList.add('hidden');
  updateDateDisplay();

  if (state.currentUserRole === 'student') {
  appShell.classList.add('hidden');
  studentShell.classList.remove('hidden');
  state.studentActiveNav = 'student-products';
  state.studentFloor = '4th';
  state.studentLocationStore = 'All';
  state.studentCategory = 'All';
  state.studentSearch = '';
  const ownProfile = state.studentProfiles[0];
  const displayLabel = key === 'student' ? (ownProfile ? `${ownProfile.name} (${ownProfile.program})` : 'JMCFI Student') : userVal;
  state.currentUserName = ownProfile ? ownProfile.name : 'JMCFI Student';
  studentUserLabel.textContent = displayLabel;
  renderStudentSidebar();
  renderStudentContent();
  showToast('Signed in to Customer Portal', 'success');
  } else if (state.currentUserRole === 'staff') {
  studentShell.classList.add('hidden');
  appShell.classList.remove('hidden');
  const matchedUser = state.users.find((u) => u.email.toLowerCase() === key);
  state.currentUserName = matchedUser ? matchedUser.name : (key === 'staff' ? 'Canteen Personnel' : userVal);
  state.salesReportLocation = state.staffLocation;
  state.salesReportFloor = state.staffFloor;
  state.staffProfileFloorFilter = 'All';
  state.activeModule = 'pos';
  updateAppShellUserUI(state.currentUserName, key === 'staff' ? 'staff@jmcfi.edu.ph' : userVal);
  renderSidebar();
  renderNotifications();
  renderActiveModule();
  showToast(`Signed in as Canteen Personnel (${state.staffFloor} Floor · ${state.staffLocation})`, 'success');
  } else if (state.currentUserRole === 'manager') {
  studentShell.classList.add('hidden');
  appShell.classList.remove('hidden');
  const matchedUser = state.users.find((u) => u.email.toLowerCase() === key);
  state.currentUserName = matchedUser ? matchedUser.name : (key === 'manager' ? 'Canteen Manager' : userVal);
  state.salesReportLocation = state.managerLocation;
  state.salesReportFloor = state.managerFloor;
  state.staffProfileFloorFilter = state.managerFloor;
  state.activeModule = 'dashboard';
  updateAppShellUserUI(state.currentUserName, key === 'manager' ? 'manager@jmcfi.edu.ph' : userVal);
  renderSidebar();
  renderNotifications();
  renderActiveModule();
  showToast(`Signed in as Canteen Manager (${state.managerFloor} Floor · ${state.managerLocation})`, 'success');

  appShell.classList.remove('hidden');
  state.currentUserName = 'Administrator';
  state.salesReportLocation = 'All';
  state.salesReportFloor = 'All';

  state.activeModule = 'dashboard';
  updateAppShellUserUI('Administrator', 'admin@jmcfi.edu.ph');
  renderSidebar();
  renderNotifications();
  renderActiveModule();
  showToast('Signed in as Administrator', 'success');
  }
 });

 function renderStudentSidebar() {
  let html = '';

  STUDENT_NAV_STRUCTURE.forEach((entry) => {
  if (entry.type === 'item') {
  const activeClass = state.studentActiveNav === entry.id ? 'active' : '';
  html += `
   <button type="button" class="nav-item ${activeClass}" data-student-nav="${entry.id}">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
   ${entry.icon}
   <\/svg>
   <span>${escapeHtml(entry.label)}</span>
   </button>
  `;
  return;
  }

  const hasActive = entry.items.some((item) => item.id === state.studentActiveNav);
  if (hasActive) {
  state.studentExpandedGroups[entry.id] = true;
  }
  const isExpanded = !!state.studentExpandedGroups[entry.id];

  html += `
  <div class="nav-group ${isExpanded ? 'expanded' : ''} ${hasActive ? 'has-active' : ''}" data-student-group-id="${entry.id}">
   <button type="button" class="nav-group-toggle" data-student-toggle-group="${entry.id}" aria-expanded="${isExpanded}">
   <span class="nav-group-toggle-left">
   <span class="nav-group-bar"></span>
   <span>${escapeHtml(entry.label)}</span>
   </span>
   <svg class="nav-group-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
   <polyline points="9 18 15 12 9 6"/>
   <\/svg>
   </button>
   <div class="nav-group-collapse">
   <div class="nav-group-items">
   ${entry.items.map((item) => {
  const activeClass = state.studentActiveNav === item.id ? 'active' : '';
  return `
    <button type="button" class="nav-item ${activeClass}" data-student-nav="${item.id}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    ${item.icon}
    <\/svg>
    <span>${escapeHtml(item.label)}</span>
    </button>
    `;
  }).join('')}
   </div>
   </div>
  </div>
  `;
  });

  studentSidebarNav.innerHTML = html;
 }

 function navigateToStudent(navId) {
  state.studentActiveNav = navId;
  renderStudentSidebar();
  renderStudentContent();
  closeStudentMobileSidebar();
 }

 studentSidebarNav.addEventListener('click', (e) => {
  const toggleBtn = e.target.closest('[data-student-toggle-group]');
  if (toggleBtn) {
  const groupId = toggleBtn.getAttribute('data-student-toggle-group');
  const nextExpanded = !state.studentExpandedGroups[groupId];
  state.studentExpandedGroups[groupId] = nextExpanded;
  const groupEl = toggleBtn.closest('.nav-group');
  if (groupEl) {
  groupEl.classList.toggle('expanded', nextExpanded);
  toggleBtn.setAttribute('aria-expanded', String(nextExpanded));
  }
  return;
  }

  const btn = e.target.closest('[data-student-nav]');
  if (btn) {
  navigateToStudent(btn.getAttribute('data-student-nav'));
  }
 });

 function buildInventoryNotifications() {
  const threshold = state.canteenSettings.lowStockThreshold || 8;
  const lowStockAlerts = [];
  const predictionAlerts = [];

  state.products.forEach((p) => {
  const floorsLabel = (p.floors || ['4th', '3rd', '2nd']).map((f) => `${f} Floor`).join(', ');
  const avgDaily = Math.max(1, Math.round((p.sold || 0) / 7));

  // 1. Inventory Low Stock & Out-of-Stock Alerts
  if (p.stock <= 0) {
  lowStockAlerts.push({
   id: `inv-out-${p.id}`,
   sortStock: p.stock,
   tag: 'Out of Stock',
   tagClass: 'badge-danger',
   text: `${p.name} is out of stock (0 servings left) across ${floorsLabel}. Immediate restock required.`,
   time: `SKU ${p.id} · ${p.category} · Priority Critical`,
   unread: !state.notificationsRead,
   targetModule: 'inventory'
  });
  } else if (p.stock <= threshold) {
  lowStockAlerts.push({
   id: `inv-low-${p.id}`,
   sortStock: p.stock,
   tag: 'Low Stock',
   tagClass: 'badge-warning',
   text: `${p.name} has only ${p.stock} serving(s) remaining (below threshold of ${threshold}) on ${floorsLabel}.`,
   time: `SKU ${p.id} · ${p.category} · Reorder Recommended`,
   unread: !state.notificationsRead,
   targetModule: 'inventory'
  });
  } else if (p.stock <= threshold + 8) {
  lowStockAlerts.push({
   id: `inv-watch-${p.id}`,
   sortStock: p.stock,
   tag: 'Monitor Stock',
   tagClass: 'badge-neutral',
   text: `${p.name} is approaching low stock with ${p.stock} servings left (${floorsLabel}).`,
   time: `SKU ${p.id} · ${p.category} · Watchlist`,
   unread: false,
   targetModule: 'inventory'
  });
  }

  // 2. Stock Demand Predictions from Past Sales History (7-day velocity)
  if (p.sold >= 30) {
  const daysUntilEmpty = p.stock > 0 ? p.stock / avgDaily : 0;
  const daysUntilThreshold = p.stock > threshold ? (p.stock - threshold) / avgDaily : 0;
  const suggestedRestock = Math.max(15, Math.ceil((avgDaily * 3) / 5) * 5);

  if (p.stock <= 0 || daysUntilEmpty <= 3.5 || daysUntilThreshold <= 2.5) {
   const horizonText = p.stock <= 0
   ? 'already depleted based on past demand'
   : daysUntilEmpty <= 1.2
   ? 'projected to sell out within 24 hours'
   : `projected to reach low stock in ~${Math.max(0.5, daysUntilThreshold).toFixed(1)} days`;

   predictionAlerts.push({
   id: `pred-${p.id}`,
   sortDays: daysUntilEmpty,
   tag: 'Stock Prediction',
   tagClass: 'badge-purple',
   text: `${p.name} averages ~${avgDaily} units/day from past history (${p.sold} sold). Current stock (${p.stock}) is ${horizonText}; suggested restock: +${suggestedRestock} units.`,
   time: `History Forecast · 7-day avg ${avgDaily}/day · ${p.locationStore || 'ExampleLocation'}`,
   unread: !state.notificationsRead && daysUntilEmpty <= 2.5,
   targetModule: 'inventory'
   });
  }
  }
  });

  lowStockAlerts.sort((a, b) => a.sortStock - b.sortStock);
  predictionAlerts.sort((a, b) => a.sortDays - b.sortDays);

  const customAlerts = (state.notifications || []).map((n) => ({
  id: `sys-${n.id}`,
  tag: 'System Alert',
  tagClass: 'badge-purple',
  text: n.text,
  time: n.time,
  unread: Boolean(n.unread),
  targetModule: 'sales-reports'
  }));

  return { lowStockAlerts, predictionAlerts, customAlerts };
 }

 function renderNotifications() {
  const { lowStockAlerts, predictionAlerts, customAlerts } = buildInventoryNotifications();
  const allItems = [...lowStockAlerts, ...predictionAlerts, ...customAlerts];

  const activeTab = state.notifFilter || 'all';

 // ==========================================
 // SVG CHARTS RENDERER (PURPLE THEME)
 // ==========================================
 function buildBarChartSvg(series, isCurrency = true) {
  const width = 520;
  const height = 210;
  const padLeft = 48;
  const padRight = 16;
  const padTop = 20;
  const padBottom = 30;
  const chartW = width - padLeft - padRight;
  const chartH = height - padTop - padBottom;
  const maxVal = Math.max(...series.map((d) => d.value), 1) * 1.15;

  const gridLines = [0, 0.25, 0.5, 0.75, 1].map((ratio) => {
  const y = padTop + chartH - chartH * ratio;
  const val = Math.round(maxVal * ratio);
  const label = val >= 1000 ? (val / 1000).toFixed(val % 1000 === 0 ? 0 : 1) + 'k' : val;
  return `
  <line x1="${padLeft}" y1="${y}" x2="${width - padRight}" y2="${y}" stroke="#EAE4E9" stroke-dasharray="3 3" />
  <text x="${padLeft - 8}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="#7A6C77">${isCurrency ? '₱' + label : label}</text>
  `;
  }).join('');

  const step = chartW / series.length;
  const barW = Math.min(34, step * 0.54);

  const bars = series.map((d, i) => {
  const barH = Math.max(4, (d.value / maxVal) * chartH);
  const x = padLeft + i * step + (step - barW) / 2;
  const y = padTop + chartH - barH;
  const formatted = isCurrency ? formatCurrency(d.value) : d.value;
  return `
  <g>
   <rect class="bar-rect" x="${x}" y="${y}" width="${barW}" height="${barH}" rx="5" fill="#4F003B">
   <title>${escapeHtml(d.label)}: ${formatted}</title>
   </rect>
   <text x="${x + barW / 2}" y="${height - 10}" text-anchor="middle" font-size="11" fill="#7A6C77">${escapeHtml(d.label)}</text>
  </g>
  `;
  }).join('');

  return `
  <svg class="svg-chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">
  ${gridLines}
  ${bars}
  <\/svg>
  `;
 }

 function openGeminiAiModal(totalSalesToday, totalOrdersToday, bestSellers, alertItems, pendingOrdersCount) {
  const topItem = bestSellers[0];
  const lowNames = alertItems.length ? alertItems.map((p) => `${p.name} (${p.stock <= 0 ? 'Out of stock' : p.stock + ' left'})`).join(', ') : 'All items sufficiently stocked';

  const bodyHtml = `
  <div style="padding: 14px; border-radius: 10px; background: var(--primary-light); border: 1px solid var(--primary-border); margin-bottom: 14px;">
  <div style="display:flex; align-items:center; gap:8px; font-weight:700; color:#1F1F1F; margin-bottom:8px;">
   <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
   <defs>
   <clipPath id="gemini-spark-clip-modal">
    <path d="M12 1.5C12 7.3 7.3 12 1.5 12C7.3 12 12 16.7 12 22.5C12 16.7 16.7 12 22.5 12C16.7 12 12 7.3 12 1.5Z"/>
   </clipPath>
   <radialGradient id="g-red-modal" cx="50%" cy="15%" r="55%">
    <stop offset="0%" stop-color="#EA4335"/>
    <stop offset="100%" stop-color="#EA4335" stop-opacity="0"/>
   </radialGradient>
   <radialGradient id="g-yellow-modal" cx="15%" cy="52%" r="55%">
    <stop offset="0%" stop-color="#FBBC04"/>
    <stop offset="100%" stop-color="#FBBC04" stop-opacity="0"/>
   </radialGradient>
   <radialGradient id="g-green-modal" cx="48%" cy="88%" r="55%">
    <stop offset="0%" stop-color="#34A853"/>
    <stop offset="100%" stop-color="#34A853" stop-opacity="0"/>
   </radialGradient>
   </defs>
   <g clip-path="url(#gemini-spark-clip-modal)">
   <rect width="24" height="24" fill="#4285F4"/>
   <rect width="24" height="24" fill="url(#g-red-modal)"/>
   <rect width="24" height="24" fill="url(#g-yellow-modal)"/>
   <rect width="24" height="24" fill="url(#g-green-modal)"/>
   </g>
   <\/svg>
   <span>Powered by Gemini — Canteen Summary</span>
  </div>
  <ul style="padding-left: 18px; font-size: 13px; color: var(--text-main); display:flex; flex-direction:column; gap:6px;">
   <li><strong>Sales Pace:</strong> ${formatCurrency(totalSalesToday)} across ${totalOrdersToday} orders today (12PM lunch peak).</li>
   <li><strong>Top Performer:</strong> ${escapeHtml(topItem.name)} (${topItem.sold} units sold).</li>
   <li><strong>Restock Priority:</strong> ${escapeHtml(lowNames)}.</li>
   <li><strong>Queue Alert:</strong> ${pendingOrdersCount} order(s) currently awaiting fulfillment.</li>
  </ul>
  </div>

  <div style="display:flex; gap:8px; margin-bottom:10px;">
  <input type="text" id="gemini-prompt-input" class="input-control" placeholder="Ask Gemini AI about canteen sales or stock..." />
  <button type="button" id="gemini-ask-btn" class="btn btn-primary">Ask</button>
  </div>
  <div id="gemini-reply-box" class="hidden" style="padding:12px; border-radius:8px; background:var(--bg); border:1px solid var(--border); font-size:13px; color:var(--text-main);"></div>
  `;

  const footerHtml = `<button type="button" class="btn btn-secondary" id="gemini-close-btn">Close</button>`;
  openModal('Gemini AI Assistant', bodyHtml, footerHtml);

  document.getElementById('gemini-close-btn').addEventListener('click', closeModal);
  document.getElementById('gemini-ask-btn').addEventListener('click', () => {
  const q = document.getElementById('gemini-prompt-input').value.trim().toLowerCase();
  const replyBox = document.getElementById('gemini-reply-box');
  if (!q) return;
  let answer = `Based on today's JMCFI Canteen activity (${formatCurrency(totalSalesToday)} revenue, ${totalOrdersToday} orders), ${topItem.name} leads demand and ${alertItems.length} item(s) need restocking.`;
  if (q.includes('stock') || q.includes('restock') || q.includes('inventory')) {
  answer = `Recommended restock: ${lowNames}. Consider replenishing at least 15–25 units before the afternoon break.`;
  } else if (q.includes('best') || q.includes('top') || q.includes('sell')) {
  answer = `Top sellers today: ${bestSellers.slice(0, 3).map((b, i) => `${i + 1}. ${b.name} (${b.sold} sold)`).join(' · ')}.`;
  }
  replyBox.textContent = answer;
  replyBox.classList.remove('hidden');
  });
 }

 function updatePosPaymentUI() {
  const total = state.cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  const receivedNum = parseFloat(state.amountReceived);
  const hasValid = !isNaN(receivedNum) && state.amountReceived !== '';
  const change = hasValid ? receivedNum - total : 0;

  const changeBox = pageContent.querySelector('.change-box');
  const changeDisplay = document.getElementById('pos-change-display');
  const completeBtn = document.getElementById('complete-txn-btn');
  const cancelBtn = document.getElementById('cancel-txn-btn');

  if (changeBox && changeDisplay) {
  if (hasValid && change < 0) {
  changeBox.classList.add('insufficient');
  changeBox.firstElementChild.textContent = 'Insufficient Amount';
  changeDisplay.textContent = formatCurrency(Math.abs(change));
  } else {
  changeBox.classList.remove('insufficient');
  changeBox.firstElementChild.textContent = 'Change';
  changeDisplay.textContent = formatCurrency(hasValid ? change : 0);
  }
  }

  if (completeBtn) {
  completeBtn.disabled = !(state.cart.length > 0 && hasValid && receivedNum >= total);
  }
  if (cancelBtn) {
  cancelBtn.disabled = state.cart.length === 0 && !state.amountReceived;
  }
 }

 function addToCart(productId) {
  const product = state.products.find((p) => p.id === productId);
  if (!product || product.stock <= 0) return;

  const existing = state.cart.find((item) => item.id === productId);
  if (existing) {
  if (existing.qty >= product.stock) {
  showToast(`Only ${product.stock} left in stock.`, 'error');
  return;
  }
  existing.qty += 1;
  } else {
  state.cart.push({
  id: product.id,
  name: product.name,
  price: product.price,
  qty: 1
  });
  }
  renderPOS();
 }

 function updateCartQty(productId, delta) {
  const item = state.cart.find((c) => c.id === productId);
  const product = state.products.find((p) => p.id === productId);
  if (!item) return;

  const nextQty = item.qty + delta;
  if (nextQty <= 0) {
  state.cart = state.cart.filter((c) => c.id !== productId);
  } else if (product && nextQty <= product.stock) {
  item.qty = nextQty;
  }
  renderPOS();
 }

 function removeFromCart(productId) {
  state.cart = state.cart.filter((c) => c.id !== productId);
  renderPOS();
 }

 function completeTransaction() {
  const subtotal = state.cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  const total = subtotal;
  const received = parseFloat(state.amountReceived);
  if (state.cart.length === 0 || isNaN(received) || received < total) return;

  const change = received - total;

  // Deduct stock and increment units sold
  state.cart.forEach((cartItem) => {
  const prod = state.products.find((p) => p.id === cartItem.id);
  if (prod) {
  prod.stock = Math.max(0, prod.stock - cartItem.qty);
  prod.sold += cartItem.qty;
  }
  });

  const nextSeq = 46 + state.transactions.filter((t) => parseInt(t.id.split('-').pop(), 10) > 45).length;
  const txnId = 'TXN-2026-' + String(nextSeq).padStart(4, '0');
  const now = new Date();
  const dateTimeStr = now.toLocaleString('en-US', {
  month: 'short',
  day: 'numeric',
  year: 'numeric',
  hour: 'numeric',
  minute: '2-digit',
  hour12: true
  });
  const timeOnlyStr = now.toLocaleTimeString('en-US', {
  hour: 'numeric',
  minute: '2-digit',
  hour12: true
  });

  const receipt = {
  id: txnId,
  dateTime: dateTimeStr,
  customer: state.scannedCustomer || 'Walk-in Customer',
  items: state.cart.map((c) => ({ ...c })),
  subtotal,
  total,
  received,
  change
  };

  state.transactions.unshift({
  id: txnId,
  time: timeOnlyStr,
  itemsCount: state.cart.reduce((s, i) => s + i.qty, 0),
  summary: state.cart.map((c) => `${c.name} (${c.qty})`).join(', '),
  total,
  received,
  change,
  cashier: 'Administrator'
  });

  state.lastReceipt = receipt;
  state.cart = [];
  state.amountReceived = '';
  state.scannedCustomer = null;

  renderPOS();
  showToast(`Transaction ${txnId} completed!`, 'success');
  showReceiptModal(receipt, true);
 }

 function processQrCodeValue(rawCode) {
  const code = rawCode.trim().toUpperCase();

  if (code.startsWith('STU-') || code.startsWith('FAC-')) {
  state.scannedCustomer = code === 'STU-2026-019' ? 'A. Bautista (BSIT-3A)' : `JMCFI Member (${code})`;
  closeModal();
  renderPOS();
  showToast(`QR Linked: ${state.scannedCustomer}`, 'success');
  return;
  }

  if (code === 'ORD-1042' || code === 'ORD-1041') {
  const orderItems = code === 'ORD-1042'
  ? [{ id: 'P002', qty: 2 }, { id: 'P008', qty: 2 }]
  : [{ id: 'P001', qty: 1 }, { id: 'P010', qty: 1 }];
  const ord = state.orders.find((o) => o.id === code);
  state.scannedCustomer = ord ? ord.customer : code;

  orderItems.forEach(({ id, qty }) => {
  for (let i = 0; i < qty; i++) {
   addToCart(id);
  }
  });
  closeModal();
  renderPOS();
  showToast(`Loaded ${code} into cart.`, 'success');
  return;
  }

  const prod = state.products.find((p) => p.id.toUpperCase() === code || p.name.toUpperCase().includes(code));
  if (prod) {
  if (prod.stock <= 0) {
  showToast(`${prod.name} is out of stock.`, 'error');
  return;
  }
  addToCart(prod.id);
  closeModal();
  showToast(`Scanned ${prod.name} (+1)`, 'success');
  return;
  }

  showToast(`Unrecognized QR code: ${rawCode}`, 'error');
 }

 function getLocalIsoDate(dateObj = new Date()) {
  const y = dateObj.getFullYear();
  const m = String(dateObj.getMonth() + 1).padStart(2, '0');
  const d = String(dateObj.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
 }

 function parseIsoDateLocal(isoStr) {
  const [y, m, d] = String(isoStr || '').split('-').map(Number);
  if (!y || !m || !d) return new Date();
  return new Date(y, m - 1, d);
 }

 function shiftIsoDate(isoStr, deltaDays) {
  const d = parseIsoDateLocal(isoStr);
  d.setDate(d.getDate() + deltaDays);
  return getLocalIsoDate(d);
 }

 function formatSalesDateLong(isoStr) {
  return parseIsoDateLocal(isoStr).toLocaleDateString('en-US', {
  weekday: 'long',
  month: 'long',
  day: 'numeric',
  year: 'numeric'
  });
 }

 function formatSalesDateShort(isoStr) {
  return parseIsoDateLocal(isoStr).toLocaleDateString('en-US', {
  month: 'short',
  day: '2-digit',
  year: 'numeric'
  });
 }

 function getSalesProductsForDate(isoStr) {
  const todayIso = getLocalIsoDate();
  if (!isoStr || isoStr === todayIso) {
  return state.products;
  }
  if (isoStr > todayIso) {
  return state.products.map((p) => ({ ...p, sold: 0 }));
  }
  if (!state.salesHistoryCache[isoStr]) {
  const dt = parseIsoDateLocal(isoStr);
  const dow = dt.getDay(); // 0=Sun, 6=Sat
  const dayWeight = dow === 0 ? 0.36 : dow === 6 ? 0.64 : (dow === 5 ? 1.12 : 0.94);

  state.salesHistoryCache[isoStr] = state.products.map((p) => {
  const seedStr = `${isoStr}|${p.id}`;
  let hash = 2166136261;
  for (let i = 0; i < seedStr.length; i++) {
   hash ^= seedStr.charCodeAt(i);
   hash = Math.imul(hash, 16777619);
  }
  const norm = ((hash >>> 0) % 1000) / 1000;
  const variance = 0.72 + norm * 0.46;
  const baseSold = Math.max(4, p.sold || 12);
  const histSold = Math.max(1, Math.round(baseSold * dayWeight * variance));
  return { ...p, sold: histSold };
  });
  }
  return state.salesHistoryCache[isoStr];
 }

 function getSalesPeriodDates(period, anchorIso, todayIso) {
  const clampedAnchor = anchorIso > todayIso ? todayIso : anchorIso;
  if (period === 'weekly') {
  const dates = [];
  for (let i = 6; i >= 0; i--) {
  dates.push(shiftIsoDate(clampedAnchor, -i));
  }
  const startIso = dates[0];
  const endIso = dates[dates.length - 1];
  return {
  period: 'weekly',
  reportTitle: 'Weekly Sales Report',
  shortTag: 'Weekly',
  dates,
  startIso,
  endIso,
  periodLabel: `${formatSalesDateShort(startIso)} – ${formatSalesDateShort(endIso)} (7 Days)`,
  fileDateToken: `${startIso}_to_${endIso}`
  };
  }
  if (period === 'monthly') {
  const anchorDt = parseIsoDateLocal(clampedAnchor);
  const y = anchorDt.getFullYear();
  const m = anchorDt.getMonth();
  const todayDt = parseIsoDateLocal(todayIso);
  const lastDayOfMonth = new Date(y, m + 1, 0).getDate();
  const endDay = (y === todayDt.getFullYear() && m === todayDt.getMonth())
  ? todayDt.getDate()
  : lastDayOfMonth;
  const dates = [];
  for (let d = 1; d <= endDay; d++) {
  dates.push(`${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`);
  }
  const startIso = dates[0];
  const endIso = dates[dates.length - 1];
  const monthName = new Date(y, m, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  return {
  period: 'monthly',
  reportTitle: 'Monthly Sales Report',
  shortTag: 'Monthly',
  dates,
  startIso,
  endIso,
  periodLabel: `${monthName} (${formatSalesDateShort(startIso)} – ${formatSalesDateShort(endIso)} · ${dates.length} Days)`,
  fileDateToken: `${y}-${String(m + 1).padStart(2, '0')}`
  };
  }
  return {
  period: 'daily',
  reportTitle: 'Daily Sales Report',
  shortTag: 'Daily',
  dates: [clampedAnchor],
  startIso: clampedAnchor,
  endIso: clampedAnchor,
  periodLabel: formatSalesDateLong(clampedAnchor),
  fileDateToken: clampedAnchor
  };
 }

 function aggregateSalesProductsForPeriod(dates) {
  const totalsById = new Map();
  state.products.forEach((p) => {
  totalsById.set(p.id, { ...p, sold: 0 });
  });
  dates.forEach((iso) => {
  const dayProducts = getSalesProductsForDate(iso);
  dayProducts.forEach((dp) => {
  const entry = totalsById.get(dp.id);
  if (entry) entry.sold += (dp.sold || 0);
  });
  });
  return Array.from(totalsById.values());
 }

   <div class="kpi-meta" style="font-size:13px;">${isManager ? `${escapeHtml(floorDisplayName)} · ${escapeHtml(selectedLoc)}` : `${sharePct}% of campus ${periodMeta.shortTag.toLowerCase()} total`}</div>

  <div class="kpi-card">

   <div class="kpi-meta" style="font-size:13px;">${activeStats.topItem ? `${formatCurrency(activeStats.topItem.sold * activeStats.topItem.price)} (${activeStats.topItem.sold} sold)` : 'No sales recorded'}</div>

  <!-- Clean Senior-Friendly View Switcher Tabs -->

  <button type="button" class="sr-view-tab ${activeTab === 'products' ? 'active' : ''}" data-sr-tab="products">Product Details (${scopedProducts.length})</button>
  <button type="button" class="sr-view-tab ${activeTab === 'template' ? 'active' : ''}" data-sr-tab="template">Official Report Sheet</button>
  <button type="button" class="sr-view-tab ${activeTab === 'submissions' ? 'active' : ''}" data-sr-tab="submissions">Manager Submissions (${submittedList.length})</button>
  </div>

  ${activeTab === 'overview' ? overviewTabHtml : ''}
  ${activeTab === 'products' ? productsTabHtml : ''}
  ${activeTab === 'submissions' ? submissionsTabHtml : ''}

  <!-- Official Printable Template Sheet (always in DOM for Print Report; visible on screen in Official Report Sheet tab) -->
  ${officialTemplatePaperHtml}
  `;

  // Helper: Select Date
  const selectSalesDate = (isoVal, keepDrawerOpen = false) => {
  if (!isoVal) return;
  const clamped = isoVal > todayIso ? todayIso : isoVal;
  const dt = parseIsoDateLocal(clamped);
  state.salesReportDate = clamped;
  state.salesReportCalMonth = { year: dt.getFullYear(), month: dt.getMonth() };
  state.salesReportHistoryOpen = keepDrawerOpen;
  state.salesReportPeriodMenuOpen = false;
  renderSalesReportsModule();
  };

  // Custom Period Dropdown handlers
  const periodBtn = document.getElementById('sr-period-dropdown-btn');
  if (periodBtn) {
  periodBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  state.salesReportPeriodMenuOpen = !state.salesReportPeriodMenuOpen;
  renderSalesReportsModule();
  });
  }

  pageContent.querySelectorAll('[data-sr-period]').forEach((opt) => {
  opt.addEventListener('click', (e) => {
  e.stopPropagation();
  const nextPeriod = opt.getAttribute('data-sr-period');
  state.salesReportPeriod = nextPeriod || 'daily';
  state.salesReportPeriodMenuOpen = false;
  renderSalesReportsModule();
  });
  });

  // Close custom period menu when clicking elsewhere inside pageContent
  if (state.salesReportPeriodMenuOpen) {
  const closePeriodMenuOnce = (e) => {
  if (!e.target.closest('#sr-period-dropdown-wrap')) {
   state.salesReportPeriodMenuOpen = false;
   document.removeEventListener('click', closePeriodMenuOnce);
   if (state.activeModule === 'sales-reports') renderSalesReportsModule();
  }
  };
  setTimeout(() => document.addEventListener('click', closePeriodMenuOnce), 0);
  }

  // Date Navigation & Today Toggle
  const customDateTrigger = document.getElementById('sr-custom-date-trigger');
  if (customDateTrigger) {
  customDateTrigger.addEventListener('click', () => {
  state.salesReportPeriodMenuOpen = false;
  state.salesReportHistoryOpen = !state.salesReportHistoryOpen;
  renderSalesReportsModule();
  });
  }

  const prevDayBtn = document.getElementById('sr-prev-day-btn');
  if (prevDayBtn) {
  prevDayBtn.addEventListener('click', () => {
  const step = activePeriod === 'weekly' ? -7 : (activePeriod === 'monthly' ? -30 : -1);
  selectSalesDate(shiftIsoDate(activeDateIso, step), state.salesReportHistoryOpen);
  });
  }

  const nextDayBtn = document.getElementById('sr-next-day-btn');
  if (nextDayBtn) {
  nextDayBtn.addEventListener('click', () => {
  if (!isViewingTodayDate) {
   const step = activePeriod === 'weekly' ? 7 : (activePeriod === 'monthly' ? 30 : 1);
   selectSalesDate(shiftIsoDate(activeDateIso, step), state.salesReportHistoryOpen);
  }
  });
  }

  const todayToggleBtn = document.getElementById('sr-today-toggle-btn');
  if (todayToggleBtn) {
  todayToggleBtn.addEventListener('click', () => {
  state.salesReportPeriodMenuOpen = false;
  if (!isDefaultTodayMode) {
   state.salesReportPeriod = 'daily';
   selectSalesDate(todayIso, false);
   showToast(`Returned to Today's Daily Sales Report (${formatSalesDateShort(todayIso)}).`, 'info');
  } else {
   state.salesReportHistoryOpen = !state.salesReportHistoryOpen;
   renderSalesReportsModule();
  }
  });
  }

  const calPrevMonthBtn = document.getElementById('sr-cal-prev-month');
  if (calPrevMonthBtn) {
  calPrevMonthBtn.addEventListener('click', () => {
  const d = new Date(calYear, calMonth - 1, 1);
  state.salesReportCalMonth = { year: d.getFullYear(), month: d.getMonth() };
  renderSalesReportsModule();
  });
  }

  const calNextMonthBtn = document.getElementById('sr-cal-next-month');
  if (calNextMonthBtn) {
  calNextMonthBtn.addEventListener('click', () => {
  const d = new Date(calYear, calMonth + 1, 1);
  state.salesReportCalMonth = { year: d.getFullYear(), month: d.getMonth() };
  renderSalesReportsModule();
  });
  }

  const closeHistoryBtn = document.getElementById('sr-close-history-btn');
  if (closeHistoryBtn) {
  closeHistoryBtn.addEventListener('click', () => {
  state.salesReportHistoryOpen = false;
  renderSalesReportsModule();
  });
  }

  const customDateApplyBtn = document.getElementById('sr-custom-date-apply');
  const customDateInputEl = document.getElementById('sr-custom-date-input');
  if (customDateApplyBtn && customDateInputEl) {
  const applyPicked = () => {
  const val = customDateInputEl.value;
  if (!val) return;
  if (val > todayIso) {
   showToast('Future dates do not have recorded sales yet. Showing Today instead.', 'warning');
   selectSalesDate(todayIso, true);
  } else {
   selectSalesDate(val, true);
   showToast(`Loaded ${periodMeta.reportTitle} for ${formatSalesDateShort(val)}.`, 'info');
  }
  };
  customDateApplyBtn.addEventListener('click', applyPicked);
  customDateInputEl.addEventListener('change', applyPicked);
  }

  pageContent.querySelectorAll('[data-sr-pick-date]').forEach((el) => {
  el.addEventListener('click', () => {
  const picked = el.getAttribute('data-sr-pick-date');
  if (picked) selectSalesDate(picked, true);
  });
  });

  // Floor, Location, and View Tab Selectors
  pageContent.querySelectorAll('[data-sr-floor]').forEach((btn) => {
  btn.addEventListener('click', () => {
  state.salesReportFloor = btn.getAttribute('data-sr-floor') || 'All';
  state.salesReportPeriodMenuOpen = false;
  renderSalesReportsModule();
  });
  });

  pageContent.querySelectorAll('[data-sr-loc]').forEach((btn) => {
  btn.addEventListener('click', () => {
  state.salesReportLocation = btn.getAttribute('data-sr-loc') || 'All';
  state.salesReportPeriodMenuOpen = false;
  renderSalesReportsModule();
  });
  });

  pageContent.querySelectorAll('[data-sr-tab]').forEach((btn) => {
  btn.addEventListener('click', () => {
  state.salesReportTab = btn.getAttribute('data-sr-tab') || 'overview';
  state.salesReportPeriodMenuOpen = false;
  renderSalesReportsModule();
  });
  });

  // Manager Submit to School Administrator
  const submitAdminBtn = document.getElementById('submit-sales-admin-btn');
  if (submitAdminBtn) {
  submitAdminBtn.addEventListener('click', () => {
  openModal(
   `Submit ${periodMeta.reportTitle} to School Administrator`,
   `<div style="padding:12px 14px; border-radius:8px; background:var(--primary-light); border:1px solid var(--primary-border); margin-bottom:14px; font-size:13.5px; line-height:1.6;">
   <div><strong>Report Type:</strong> ${escapeHtml(periodMeta.reportTitle)}</div>
   <div><strong>Coverage Period:</strong> ${escapeHtml(periodMeta.periodLabel)}</div>
   <div><strong>Floor Assigned:</strong> ${escapeHtml(floorDisplayName)}</div>
   <div><strong>Specific Location:</strong> ${escapeHtml(selectedLoc)}</div>
   <div><strong>Gross Revenue:</strong> ${formatCurrency(activeStats.revenue)} (${activeStats.units} units sold)</div>
   </div>
   <div class="form-group">
   <label class="form-label" for="sr-submit-remarks">Remarks / Notes for School Administrator</label>
   <textarea id="sr-submit-remarks" class="input-control" rows="3" placeholder="e.g. Sales verified against POS cash count and ready for review." style="resize:vertical;"></textarea>
   </div>`,
   `<button type="button" class="btn btn-secondary" id="sr-submit-cancel">Cancel</button>
   <button type="button" class="btn btn-primary" id="sr-submit-confirm">Confirm &amp; Submit to Admin</button>`
  );
  document.getElementById('sr-submit-cancel').addEventListener('click', closeModal);
  document.getElementById('sr-submit-confirm').addEventListener('click', () => {
   const remarks = document.getElementById('sr-submit-remarks').value.trim() || `Verified ${periodMeta.reportTitle} for ${floorDisplayName} (${selectedLoc}).`;
   const nextId = 'SR-2026-' + String(state.submittedSalesReports.length + 1).padStart(3, '0');
   state.submittedSalesReports.unshift({
   id: nextId,
   date: `${periodMeta.shortTag} · ${activeDateShort}`,
   floor: floorDisplayName,
   location: selectedLoc,
   submittedBy: state.currentUserName || 'Canteen Manager',
   unitsSold: activeStats.units,
   grossRevenue: activeStats.revenue,
   remarks,
   status: 'Submitted to Admin'
   });
   state.notifications.unshift({
   id: Date.now(),
   text: `New ${periodMeta.reportTitle} (${nextId}) submitted by ${state.currentUserName || 'Canteen Manager'} for ${floorDisplayName} · ${selectedLoc} (${formatCurrency(activeStats.revenue)}).`,
   time: 'Just now',
   unread: true
   });
   renderNotifications();
   closeModal();
   renderSalesReportsModule();
   showToast(`${periodMeta.reportTitle} (${nextId}) submitted to School Administrator.`, 'success');
  });
  });
  }

  pageContent.querySelectorAll('[data-review-sales-rep]').forEach((btn) => {
  btn.addEventListener('click', () => {
  const refId = btn.getAttribute('data-review-sales-rep');
  const found = state.submittedSalesReports.find((r) => r.id === refId);
  if (found) {
   found.status = 'Reviewed by Admin';
   renderSalesReportsModule();
   showToast(`Sales Report ${refId} marked as reviewed.`, 'success');
  }
  });
  });

  // Print Official Formatted Report Template
  document.getElementById('print-sales-btn').addEventListener('click', () => {
  showToast(`Printing ${periodMeta.reportTitle} for ${scopeShortName} (${periodMeta.periodLabel}).`, 'info');
  window.print();
  });

  // Export Detailed Template-Based CSV scoped strictly to Period + Date + Floor + Location
  document.getElementById('export-sales-btn').addEventListener('click', () => {
  const csvCell = (val) => `"${String(val ?? '').replace(/"/g, '""')}"`;
  const rows = [];

  // Official Template Metadata Header
  rows.push([csvCell('JOSE MARIA COLLEGE FOUNDATION, INC. — JMCFI-MealHub Canteen Operations')]);
  rows.push([csvCell('Report Title'), csvCell(periodMeta.reportTitle)]);
  rows.push([csvCell('Coverage Period'), csvCell(periodMeta.periodLabel)]);
  rows.push([csvCell('Canteen Floor'), csvCell(floorDisplayName)]);
  rows.push([csvCell('Specific Canteen Location'), csvCell(locDisplayName)]);
  rows.push([csvCell('Prepared By'), csvCell(state.currentUserName || 'Administrator')]);
  rows.push([csvCell('Operating Hours'), csvCell('06:30 AM - 06:00 PM')]);
  rows.push([]);

  // PART I - Sales Summary by Category
  rows.push([csvCell(`PART I - ${periodMeta.shortTag.toUpperCase()} SALES SUMMARY BY CATEGORY`)]);
  rows.push(['Category', 'No. of Transactions', 'Units Sold', 'Gross Sales (PHP)', 'Share (%)', 'Remarks'].map(csvCell));
  part1Rows.forEach((r) => {
  rows.push([csvCell(r.category), r.txns, r.units, r.gross.toFixed(2), `${r.share}%`, csvCell(r.remarks)]);
  });
  rows.push([csvCell('TOTAL GROSS SALES'), totalTxns, activeStats.units, totalGross.toFixed(2), '100%', '']);
  rows.push([]);

  // PART II - Cash Accountability
  rows.push([csvCell(`PART II - CASH ACCOUNTABILITY (${periodMeta.shortTag.toUpperCase()})`)]);
  rows.push(['Item', 'Amount (PHP)'].map(csvCell));
  rows.push([csvCell('Opening Cash Fund (Fund Float)'), openingCashFund.toFixed(2)]);
  rows.push([csvCell('Total Cash Collected (Gross Sales)'), cashCollected.toFixed(2)]);
  rows.push([csvCell('Total Cash on Hand'), cashOnHand.toFixed(2)]);
  rows.push([csvCell('Less: Opening Cash Fund'), openingCashFund.toFixed(2)]);
  rows.push([csvCell('Net Cash Sales Remitted'), netRemitted.toFixed(2)]);
  rows.push([]);

  // PART III - Day-by-Day Breakdown (Weekly / Monthly)
  if (activePeriod !== 'daily') {
  rows.push([csvCell(`PART III - DAY-BY-DAY ${periodMeta.shortTag.toUpperCase()} BREAKDOWN (${periodDailyBreakdown.length} DAYS)`)]);
  rows.push(['Date', 'Day', 'Transactions', 'Units Sold', 'Gross Revenue (PHP)'].map(csvCell));
  periodDailyBreakdown.forEach((d) => {
   rows.push([csvCell(d.iso), csvCell(d.weekday), d.txns, d.units, d.revenue.toFixed(2)]);
  });
  rows.push([]);
  }

  // PART III / IV - Itemized Product Sales
  rows.push([csvCell(`${activePeriod !== 'daily' ? 'PART IV' : 'PART III'} - ITEMIZED PRODUCT SALES (${scopeShortName})`)]);
  rows.push(['SKU', 'Product Name', 'Category', 'Available Floors', 'Location Store', 'Unit Price (PHP)', 'Units Sold', 'Gross Revenue (PHP)'].map(csvCell));
  scopedProducts.forEach((p) => {
  rows.push([
   csvCell(p.id),
   csvCell(p.name),
   csvCell(p.category),
   csvCell((p.floors || ['4th', '3rd', '2nd']).map((f) => f + ' Floor').join(' / ')),
   csvCell(p.locationStore || 'ExampleLocation'),
   p.price.toFixed(2),
   p.sold,
   (p.sold * p.price).toFixed(2)
  ]);
  });
  rows.push([]);

  // Sign-off section
  rows.push([csvCell('SIGN-OFF'), csvCell('Prepared By'), csvCell(state.currentUserName || 'Administrator'), csvCell(`Date: ${activeDateShort}`)]);
  rows.push(['', csvCell('Verified By (Canteen Supervisor)'), '', csvCell('Date:')]);
  rows.push(['', csvCell('Noted By (VP for Administration)'), '', csvCell('Date:')]);

  const safeFloorToken = selectedFloor === 'All' ? 'AllFloors' : `${selectedFloor}Floor`;
  const safeLocToken = selectedLoc === 'All' ? 'AllLocations' : selectedLoc.replace(/[^A-Za-z0-9_-]/g, '');
  const fileName = `JMCFI-${periodMeta.shortTag}-Sales-Report-${periodMeta.fileDateToken}-${safeFloorToken}-${safeLocToken}.csv`;

  const csv = rows.map((r) => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`Exported ${fileName}`, 'success');
  });
 }

  return (sum / totalCount).toFixed(1);

  bindField('anf-sign-received', 'signReceivedBy');
  bindField('anf-sign-received-date', 'signReceivedDate');

  const refreshSummaryDom = () => {
  const cCount = allItems.filter((i) => draft.items[i.id] === 'Compliant').length;
  const ncCount = allItems.filter((i) => draft.items[i.id] === 'Non-Compliant').length;
  const nCount = allItems.filter((i) => draft.items[i.id] === 'N/A').length;

  const pillEl = document.getElementById('anf-score-pill');
  if (pillEl) {
  pillEl.className = `badge ${ncCount > 0 ? 'badge-warning' : 'badge-purple'}`;
  pillEl.textContent = `✓ ${cCount}/${totalItems} Compliant${ncCount > 0 ? ` · ${ncCount} ✗` : ''}${nCount > 0 ? ` · ${nCount} N/A` : ''}`;
  }
  const compEl = document.getElementById('anf-total-compliant');
  if (compEl) compEl.textContent = `${cCount} / ${totalItems}`;
  const nonCompEl = document.getElementById('anf-total-noncompliant');
  if (nonCompEl) {
  nonCompEl.textContent = String(ncCount);
  nonCompEl.style.color = ncCount > 0 ? '#B91C1C' : 'var(--text-main)';
  }
  };

  draft.items[itemId] = draft.items[itemId] === val ? '' : val;

  const rowEl = btn.closest('tr');
  if (rowEl) {
   rowEl.querySelectorAll('[data-anf-item]').forEach((b) => {
   const bVal = b.getAttribute('data-anf-val');
   const current = draft.items[itemId];
   b.classList.toggle('active-pass', current === 'Compliant' && bVal === 'Compliant');
   b.classList.toggle('active-fail', current === 'Non-Compliant' && bVal === 'Non-Compliant');
   if (bVal === 'N/A') {
   if (current === 'N/A') {
    b.style.background = '#E5E7EB';
    b.style.borderColor = '#6B7280';
    b.style.color = '#1F2937';
   } else {
    b.style.background = '';
    b.style.borderColor = '';
    b.style.color = '';
   }
   }
   });
  }
  refreshSummaryDom();
  });
  });

  allItems.forEach((i) => { draft.items[i.id] = 'Compliant'; });

  }
  renderInspectionChecklistModule();
  showToast('All 33 inspection items marked Compliant (✓).', 'info');
  });

  document.getElementById('reset-chk-btn').addEventListener('click', () => {
  state.annexFDraft = createDefaultAnnexFDraft(false);

  showToast('Canteen Inspection Checklist cleared.', 'info');
  });

  document.getElementById('save-chk-btn').addEventListener('click', () => {
  const cCount = allItems.filter((i) => draft.items[i.id] === 'Compliant').length;
  const ncCount = allItems.filter((i) => draft.items[i.id] === 'Non-Compliant').length;
  const pct = Math.round((cCount / Math.max(totalItems, 1)) * 100);
  const nextId = 'ANF-2026-' + String(15 + state.annexFLogs.length).padStart(3, '0');
  const assessmentText = draft.overallAssessment.trim() || (ncCount === 0 ? 'Satisfactory — Passed' : 'Needs Corrective Action');

  state.annexFLogs.unshift({
  id: nextId,
  date: draft.date || '2026-11-19',
  time: draft.time || '02:00 PM',
  inspector: draft.inspector || 'VP for Administration Representative',
  canteen: draft.canteen || '4th Floor Canteen',
  inspectionType: draft.inspectionType || 'Scheduled Inspection',
  compliantCount: cCount,
  nonCompliantCount: ncCount,
  assessment: assessmentText,
  correctiveActions: draft.correctiveActions || '',
  targetDate: draft.targetDate || '—',
  snapshot: JSON.parse(JSON.stringify(draft))
  });

  state.inspections.unshift({
  id: 'INS-2026-' + (15 + state.inspections.length),
  area: `${draft.canteen || '4th Floor Canteen'}`,
  inspector: draft.inspector || 'VP for Administration Representative',
  date: draft.date || 'Nov 19, 2026',
  score: `${pct}/100`,
  status: ncCount === 0 && pct >= 85 ? 'Passed' : 'Needs Attention'
  });

  renderInspectionChecklistModule();
  showToast(`Inspection Audit (${nextId}) submitted (${cCount}/${totalItems} Compliant).`, 'success');
  });

  pageContent.querySelectorAll('[data-anf-load]').forEach((btn) => {
  btn.addEventListener('click', () => {
  const auditId = btn.getAttribute('data-anf-load');
  const found = state.annexFLogs.find((l) => l.id === auditId);
  if (!found) return;
  if (found.snapshot) {
   state.annexFDraft = JSON.parse(JSON.stringify(found.snapshot));
  } else {
   const restored = createDefaultAnnexFDraft(found.nonCompliantCount === 0);
   restored.date = found.date;
   restored.time = found.time;
   restored.inspector = found.inspector;
   restored.canteen = found.canteen;
   restored.inspectionType = found.inspectionType;
   restored.overallAssessment = found.assessment;
   restored.correctiveActions = found.correctiveActions;
   restored.targetDate = found.targetDate;
   state.annexFDraft = restored;
  }
  renderInspectionChecklistModule();
  showToast(`Loaded audit ${auditId} into inspection checklist.`, 'info');
  });
  });
 }

 function createExpiredDisposalDraft(includeExisting = true) {
  const mapped = includeExisting
  ? state.expiredDisposals.map((d) => ({
  productName: d.productName || '',
  brandSupplier: d.brandSupplier || '',
  qtyDisposed: d.qtyDisposed || '',
  unit: d.unit || '',
  expiryDate: d.expiryDate || '',
  discoveryDate: d.discoveryDate || '',
  disposedDate: d.disposedDate || '',
  method: d.method || '',
  verifiedBy: d.verifiedBy || ''
  }))
  : [];
  while (mapped.length < 10) {
  mapped.push({
  productName: '',
  brandSupplier: '',
  qtyDisposed: '',
  unit: '',
  expiryDate: '',
  discoveryDate: '',
  disposedDate: '',
  method: '',
  verifiedBy: ''
  });
  }
  return {
  monthYear: 'November 2026',
  responsiblePersonnel: `${state.currentUserName || 'Carlo Navarro'} — Canteen Operations`,
  preparedBy: state.currentUserName || 'Carlo Navarro',
  witnessedBy: '',
  rows: mapped
  };
 }

 function createWeeklyInventoryDraft(fromCatalog = true) {
  const rows = fromCatalog
  ? state.products.map((p) => {
  const unit = p.category === 'Drinks' ? 'bottles / cups' : (p.category === 'Snacks' ? 'pcs' : 'servings');
  const beg = p.stock + p.sold;
  return {
   productName: p.name,
   unit,
   beginningStock: beg,
   qtyReceived: 0,
   qtyUsed: p.sold,
   endingStock: p.stock,
   expirationDate: p.category === 'Drinks' ? 'Dec 2026' : 'Daily Fresh',
   remarks: p.stock <= 0 ? 'Zero-stock; re-order needed' : ''
  };
  })
  : Array.from({ length: 12 }, () => ({
  productName: '',
  unit: '',
  beginningStock: '',
  qtyReceived: '',
  qtyUsed: '',
  endingStock: '',
  expirationDate: '',
  remarks: ''
  }));

  return {
  weekCovered: 'Nov 16 – Nov 21, 2026',
  conductedBy: `${state.currentUserName || 'Carlo Navarro'} — Canteen Operations`,
  countDate: '2026-11-19',
  preparedBy: state.currentUserName || 'Carlo Navarro',
  witnessedBy: '',
  rows
  };
 }

 function computeWeeklyInventoryTotals(rows) {
  const toNum = (v) => {
  const n = Number(v);
  return Number.isFinite(n) && v !== '' ? n : 0;
  };
  return rows.reduce(
  (acc, r) => ({
  beg: acc.beg + toNum(r.beginningStock),
  rec: acc.rec + toNum(r.qtyReceived),
  used: acc.used + toNum(r.qtyUsed),
  end: acc.end + toNum(r.endingStock)
  }),
  { beg: 0, rec: 0, used: 0, end: 0 }
  );
 }

   r.endingStock || 0,
   `"${String(r.expirationDate || '').replace(/"/g, '""')}"`,
   `"${String(r.remarks || '').replace(/"/g, '""')}"`
   ]);
  }
  });
  const t = computeWeeklyInventoryTotals(draft.rows);
  rows.push(['TOTAL', '', t.beg, t.rec, t.used, t.end, '', '']);
  const csv = rows.map((r) => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'JMCFI-MealHub-Weekly-Inventory-Logbook.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Weekly Inventory Logbook CSV exported.', 'success');
  });
 }

 function createDailySalesDraft(fromCatalog = true) {
  const meals = state.products.filter((p) => p.category === 'Meals');
  const snacks = state.products.filter((p) => p.category === 'Snacks');
  const drinks = state.products.filter((p) => p.category === 'Drinks');
  const desserts = state.products.filter((p) => p.category === 'Desserts');

  const sumQty = (arr) => arr.reduce((s, p) => s + p.sold, 0);
  const sumAmt = (arr) => arr.reduce((s, p) => s + p.sold * p.price, 0);

  const part1Rows = fromCatalog
  ? [
  { category: 'Cooked Meals / Rice Meals', txns: sumQty(meals), gross: sumAmt(meals), remarks: 'Synced from POS Meals' },
  { category: 'Snacks / Light Meals', txns: sumQty(snacks), gross: sumAmt(snacks), remarks: 'Sandwiches, turon & pandesal' },
  { category: 'Beverages (Cold)', txns: sumQty(drinks), gross: sumAmt(drinks), remarks: 'Calamansi, Milo & mineral water' },
  { category: 'Beverages (Hot)', txns: '', gross: '', remarks: '' },
  { category: 'Packaged / Convenience Items', txns: '', gross: '', remarks: '' },
  { category: 'Other Items', txns: sumQty(desserts), gross: sumAmt(desserts), remarks: 'Desserts & Halo-Halo' }
  ]
  : [
  { category: 'Cooked Meals / Rice Meals', txns: '', gross: '', remarks: '' },
  { category: 'Snacks / Light Meals', txns: '', gross: '', remarks: '' },
  { category: 'Beverages (Cold)', txns: '', gross: '', remarks: '' },
  { category: 'Beverages (Hot)', txns: '', gross: '', remarks: '' },
  { category: 'Packaged / Convenience Items', txns: '', gross: '', remarks: '' },
  { category: 'Other Items', txns: '', gross: '', remarks: '' }
  ];

  const totalGross = part1Rows.reduce((s, r) => s + (Number(r.gross) || 0), 0);

  return {
  date: '2026-11-19',
  openingTime: '06:30 AM',
  cashier: `${state.currentUserName || 'Maria Santos'} — Cashier`,
  closingTime: '06:00 PM',
  canteen: state.currentUserRole === 'manager' ? `${state.managerFloor} Floor Canteen` : '4th Floor Canteen',
  part1: part1Rows,
  openingCashFund: fromCatalog ? 2000 : '',
  cashCollected: fromCatalog ? totalGross : '',
  cashCollectedManual: false,
  expenseProcurement: fromCatalog ? 1850 : '',
  expenseUtilities: '',
  expenseOtherNote: '',
  expenseOtherAmt: '',
  preparedBy: state.currentUserName || 'Maria Santos',
  preparedDate: 'Nov 19, 2026',
  verifiedBy: '',
  verifiedDate: '',
  notedBy: '',
  notedDate: ''
  };
 }

  const rows = [['Section', 'Item / Category', 'Transactions', 'Amount (PHP)', 'Remarks']];
  draft.part1.forEach((r) => {
  rows.push(['PART I - SALES SUMMARY', `"${r.category}"`, r.txns || 0, r.gross || 0, `"${String(r.remarks || '').replace(/"/g, '""')}"`]);
  });
  rows.push(['PART I - SALES SUMMARY', 'TOTAL GROSS SALES', calc.totalTxns, calc.totalGross, '']);
  rows.push(['PART II - CASH ACCOUNTABILITY', 'Opening Cash Fund (Fund Float)', '', calc.openFund, '']);
  rows.push(['PART II - CASH ACCOUNTABILITY', 'Total Cash Collected (Sales)', '', calc.collected, '']);
  rows.push(['PART II - CASH ACCOUNTABILITY', 'Total Cash on Hand (End of Day)', '', calc.cashOnHand, '']);
  rows.push(['PART II - CASH ACCOUNTABILITY', 'Less: Opening Cash Fund', '', calc.openFund, '']);
  rows.push(['PART II - CASH ACCOUNTABILITY', 'Net Cash Sales Remitted', '', calc.netRemitted, '']);
  rows.push(['PART III - DAILY EXPENSES', 'Procurement / Restocking', '', Number(draft.expenseProcurement) || 0, '']);
  rows.push(['PART III - DAILY EXPENSES', 'Utilities (estimated)', '', Number(draft.expenseUtilities) || 0, '']);
  rows.push(['PART III - DAILY EXPENSES', `"Other Expenses (${draft.expenseOtherNote || 'specify'})"`, '', Number(draft.expenseOtherAmt) || 0, '']);
  rows.push(['PART III - DAILY EXPENSES', 'TOTAL EXPENSES', '', calc.totalExpenses, '']);

  const csv = rows.map((r) => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `JMCFI-MealHub-Daily-Sales-${draft.date || 'report'}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Daily Sales Report CSV exported.', 'success');
  });
 }

  const toNum = (v) => (v !== '' && Number.isFinite(Number(v)) ? Number(v) : 0);
  const grossMonth = draft.income.reduce((s, r) => s + toNum(r.month), 0);
  const grossYtd = draft.income.reduce((s, r) => s + toNum(r.ytd), 0);

  const expYtd = draft.expenses.reduce((s, r) => s + toNum(r.ytd), 0);

  const netYtd = grossYtd - expYtd;
  return { grossMonth, grossYtd, expMonth, expYtd, netMonth, netYtd };

    title="Mark Non-Compliant (X)">X</button>
   </div>
   </td>
   <td style="width: 28%;">
   <input type="text"
    class="annex-inline-input"
    data-dml-remark="${item.id}"
    placeholder="Add remark..."
    value="${escapeHtml(rem)}" />
   </td>
   </tr>
  `;
  }).join('');
  return sectionHeader + itemRows;
  }).join('');

  pageContent.innerHTML = `
  <div class="page-header-row">
  <div>
   <h2>Daily Canteen Monitoring Log</h2>
   <p>Daily sanitary, product expiration, facility, stock, and customer service monitoring</p>
  </div>
  <div class="toolbar-inline">
   <span class="badge ${failCount > 0 ? 'badge-warning' : 'badge-purple'}" id="dml-score-badge" style="font-size:12.5px; padding:6px 12px;">
