      function renderStaffProfileModule() {
        pageContent.innerHTML = `
          <div class="page-header-row">
            <div>
              <h2>Staff Profile</h2>
              <p>Directory of JMCFI canteen personnel and faculty account holders</p>
            </div>
            <button type="button" class="btn btn-primary" id="add-staff-profile-btn">+ Add Staff Profile</button>
          </div>
          <div class="card">
            <div class="card-header">
              <div class="card-title">Staff Directory (${state.staffProfiles.length})</div>
              <span class="badge badge-purple">JMCFI Personnel</span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>Staff ID</th><th>Full Name</th><th>Department</th><th>Position</th><th>Schedule / Type</th><th>Contact</th><th>Status</th></tr>
                </thead>
                <tbody>
                  ${state.staffProfiles.map((s) => `
                    <tr>
                      <td><strong>${escapeHtml(s.id)}</strong></td>
                      <td>${escapeHtml(s.name)}</td>
                      <td>${escapeHtml(s.department)}</td>
                      <td>${escapeHtml(s.position)}</td>
                      <td>${escapeHtml(s.shift)}</td>
                      <td>${escapeHtml(s.contact)}</td>
                      <td><span class="badge ${s.status === 'On Duty' || s.status === 'Active' ? 'badge-success' : 'badge-neutral'}">${escapeHtml(s.status)}</span></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
        document.getElementById('add-staff-profile-btn').addEventListener('click', () => {
          openModal(
            'Add Staff Profile',
            `<div class="form-group"><label class="form-label">Full Name</label><input type="text" id="sp-name" class="input-control" placeholder="e.g. Elena Cruz" /></div>
             <div class="form-group"><label class="form-label">Department</label><input type="text" id="sp-dept" class="input-control" placeholder="e.g. Canteen Operations" /></div>
             <div class="settings-grid">
               <div class="form-group"><label class="form-label">Position</label><input type="text" id="sp-pos" class="input-control" placeholder="Cashier / Faculty" /></div>
               <div class="form-group"><label class="form-label">Contact</label><input type="text" id="sp-contact" class="input-control" placeholder="09XX-XXX-XXXX" /></div>
             </div>`,
            `<button type="button" class="btn btn-secondary" id="sp-cancel">Cancel</button>
             <button type="button" class="btn btn-primary" id="sp-save">Save Profile</button>`
          );
          document.getElementById('sp-cancel').addEventListener('click', closeModal);
          document.getElementById('sp-save').addEventListener('click', () => {
            const name = document.getElementById('sp-name').value.trim();
            const dept = document.getElementById('sp-dept').value.trim() || 'Canteen Operations';
            const pos = document.getElementById('sp-pos').value.trim() || 'Staff';
            const contact = document.getElementById('sp-contact').value.trim() || '0917-000-0000';
            if (!name) {
              showToast('Please enter a staff name.', 'error');
              return;
            }
            const nextId = 'STF-' + (101 + state.staffProfiles.length);
            state.staffProfiles.unshift({ id: nextId, name, department: dept, position: pos, shift: '8:00 AM – 4:00 PM', contact, status: 'Active' });
            closeModal();
            renderStaffProfileModule();
            showToast(`${name} added to Staff Profile.`, 'success');
          });
        });
      }

      function renderStudentsProfileModule() {
        pageContent.innerHTML = `
          <div class="page-header-row">
            <div>
              <h2>Students Profile</h2>
              <p>Registered JMCFI student accounts, QR verification, and canteen meal balances</p>
            </div>
            <button type="button" class="btn btn-primary" id="add-student-profile-btn">+ Register Student</button>
          </div>
          <div class="card">
            <div class="card-header">
              <div class="card-title">Student Accounts (${state.studentProfiles.length})</div>
              <span class="badge badge-purple">QR Linked</span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>Student ID</th><th>Full Name</th><th>Program / Section</th><th>QR Status</th><th>Canteen Balance</th><th>Orders</th><th>Action</th></tr>
                </thead>
                <tbody>
                  ${state.studentProfiles.map((st) => `
                    <tr>
                      <td><strong>${escapeHtml(st.id)}</strong></td>
                      <td>${escapeHtml(st.name)}</td>
                      <td>${escapeHtml(st.program)}</td>
                      <td><span class="badge ${st.qrStatus === 'Verified' ? 'badge-success' : 'badge-warning'}">${escapeHtml(st.qrStatus)}</span></td>
                      <td><strong>${formatCurrency(st.balance)}</strong></td>
                      <td>${st.ordersCount}</td>
                      <td>
                        <button type="button" class="btn btn-secondary btn-sm" data-use-student-pos="${escapeHtml(st.id)}">Use in POS</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
        pageContent.querySelectorAll('[data-use-student-pos]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const st = state.studentProfiles.find((s) => s.id === btn.getAttribute('data-use-student-pos'));
            if (st) {
              state.scannedCustomer = `${st.name} (${st.program})`;
              navigateTo('pos');
              showToast(`Linked ${st.name} to POS cart.`, 'success');
            }
          });
        });
        document.getElementById('add-student-profile-btn').addEventListener('click', () => {
          openModal(
            'Register Student Profile',
            `<div class="form-group"><label class="form-label">Full Name</label><input type="text" id="stp-name" class="input-control" placeholder="e.g. L. Navarro" /></div>
             <div class="settings-grid">
               <div class="form-group"><label class="form-label">Program / Section</label><input type="text" id="stp-prog" class="input-control" placeholder="e.g. BSIT - 2A" /></div>
               <div class="form-group"><label class="form-label">Initial Balance (₱)</label><input type="number" id="stp-bal" class="input-control" min="0" value="200" /></div>
             </div>`,
            `<button type="button" class="btn btn-secondary" id="stp-cancel">Cancel</button>
             <button type="button" class="btn btn-primary" id="stp-save">Register Student</button>`
          );
          document.getElementById('stp-cancel').addEventListener('click', closeModal);
          document.getElementById('stp-save').addEventListener('click', () => {
            const name = document.getElementById('stp-name').value.trim();
            const program = document.getElementById('stp-prog').value.trim() || 'BSIT - 1A';
            const balance = Math.max(0, parseFloat(document.getElementById('stp-bal').value) || 0);
            if (!name) {
              showToast('Please enter a student name.', 'error');
              return;
            }
            const nextId = 'STU-2026-' + String(120 + state.studentProfiles.length);
            state.studentProfiles.unshift({ id: nextId, name, program, qrStatus: 'Verified', balance, ordersCount: 0, status: 'Active' });
            closeModal();
            renderStudentsProfileModule();
            showToast(`${name} registered in Students Profile.`, 'success');
          });
        });
      }

      function renderUsersModule() {
        pageContent.innerHTML = `
          <div class="page-header-row">
            <div>
              <h2>User Management</h2>
              <p>Manage canteen administrators, cashiers, and inventory staff</p>
            </div>
            <button type="button" class="btn btn-primary" id="add-user-btn">+ Add Staff Account</button>
          </div>
          <div class="card">
            <div class="card-header"><div class="card-title">System Accounts (${state.users.length})</div></div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>User ID</th><th>Full Name</th><th>Email</th><th>Role</th><th>Last Active</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody>
                  ${state.users.map((u) => `
                    <tr>
                      <td><strong>${escapeHtml(u.id)}</strong></td>
                      <td>${escapeHtml(u.name)}</td>
                      <td>${escapeHtml(u.email)}</td>
                      <td><span class="badge badge-purple">${escapeHtml(u.role)}</span></td>
                      <td>${escapeHtml(u.lastActive)}</td>
                      <td><span class="badge ${u.status === 'Active' ? 'badge-success' : 'badge-neutral'}">${escapeHtml(u.status)}</span></td>
                      <td>
                        <button type="button" class="btn btn-secondary btn-sm" data-toggle-user="${u.id}">
                          ${u.status === 'Active' ? 'Deactivate' : 'Activate'}
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
        pageContent.querySelectorAll('[data-toggle-user]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const usr = state.users.find((u) => u.id === btn.getAttribute('data-toggle-user'));
            if (usr) {
              usr.status = usr.status === 'Active' ? 'Inactive' : 'Active';
              renderUsersModule();
              showToast(`${usr.name} is now ${usr.status}.`, 'info');
            }
          });
        });
        document.getElementById('add-user-btn').addEventListener('click', () => {
          showToast('New staff modal triggered (demo action).', 'info');
        });
      }

      function renderSettingsModule() {
        pageContent.innerHTML = `
          <div class="page-header-row">
            <div>
              <h2>System Settings</h2>
              <p>Configure JMCFI E-Canteen preferences, stock alerts, and receipt details</p>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><div class="card-title">General Configuration</div></div>
            <div class="card-body">
              <form id="settings-form">
                <div class="settings-grid">
                  <div class="form-group">
                    <label class="form-label" for="set-name">Canteen Name</label>
                    <input type="text" id="set-name" class="input-control" value="${escapeHtml(state.canteenSettings.canteenName)}" />
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="set-threshold">Low Stock Alert Threshold</label>
                    <input type="number" id="set-threshold" class="input-control" min="1" value="${state.canteenSettings.lowStockThreshold}" />
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label" for="set-address">Campus Address</label>
                  <input type="text" id="set-address" class="input-control" value="${escapeHtml(state.canteenSettings.campusAddress)}" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="set-footer">Receipt Footer Message</label>
                  <input type="text" id="set-footer" class="input-control" value="${escapeHtml(state.canteenSettings.receiptFooter)}" />
                </div>
                <button type="submit" class="btn btn-primary">Save Settings</button>
              </form>
            </div>
          </div>
        `;
        document.getElementById('settings-form').addEventListener('submit', (e) => {
          e.preventDefault();
          state.canteenSettings.canteenName = document.getElementById('set-name').value.trim() || state.canteenSettings.canteenName;
          state.canteenSettings.lowStockThreshold = Math.max(1, parseInt(document.getElementById('set-threshold').value, 10) || 8);
          state.canteenSettings.campusAddress = document.getElementById('set-address').value.trim() || state.canteenSettings.campusAddress;
          state.canteenSettings.receiptFooter = document.getElementById('set-footer').value.trim() || state.canteenSettings.receiptFooter;
          showToast('Canteen settings saved successfully.', 'success');
        });
      }

      // Initialize Date on Load
      updateDateDisplay();
    })();
    </script>
  </body>
