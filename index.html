<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JMCFI - Canteen</title>
    <style>
    :root {
      --primary: #4F003B;
      --primary-dark: #360028;
      --primary-light: #F9EDF6;
      --primary-border: #E5C7DD;
      --white: #FFFFFF;
      --bg: #F5F5F5;
      --text-main: #231822;
      --text-secondary: #7A6C77;
      --border: #EAE4E9;
      --success: #16A34A;
      --success-bg: #ECFDF3;
      --warning: #D97706;
      --warning-bg: #FFFBEB;
      --danger: #DC2626;
      --danger-bg: #FEF2F2;
      --shadow-sm: 0 1px 2px rgba(37, 34, 56, 0.05);
      --shadow-md: 0 4px 14px rgba(37, 34, 56, 0.06);
      --shadow-lg: 0 12px 32px rgba(37, 34, 56, 0.12);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --sidebar-width: 256px;
      --header-height: 68px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    .hidden {
      display: none !important;
    }

    /* ========================
       BUTTONS & INPUTS
    ======================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-weight: 500;
      font-size: 13.5px;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background-color: var(--primary);
      color: var(--white);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-dark);
    }

    .btn-secondary {
      background-color: var(--white);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary-border);
      color: var(--primary-dark);
    }

    .btn-ghost {
      background-color: transparent;
      color: var(--text-secondary);
    }

    .btn-ghost:hover:not(:disabled) {
      background-color: var(--primary-light);
      color: var(--primary);
    }

    .btn-danger-outline {
      background-color: var(--white);
      color: var(--danger);
      border: 1px solid #FECACA;
    }

    .btn-danger-outline:hover:not(:disabled) {
      background-color: var(--danger-bg);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12.5px;
    }

    .btn-lg {
      padding: 11px 20px;
      font-size: 14.5px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .input-control, .select-control {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background-color: var(--white);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input-control:focus, .select-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 0, 59, 0.12);
    }

    .input-control::placeholder {
      color: var(--text-secondary);
    }

    /* ========================
       BADGES
    ======================== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }

    .badge-purple {
      background-color: var(--primary-light);
      color: var(--primary-dark);
    }

    .badge-success {
      background-color: var(--success-bg);
      color: var(--success);
    }

    .badge-warning {
      background-color: var(--warning-bg);
      color: var(--warning);
    }

    .badge-danger {
      background-color: var(--danger-bg);
      color: var(--danger);
    }

    .badge-neutral {
      background-color: #F3F2F8;
      color: var(--text-secondary);
    }

    /* ========================
       LOGIN PAGE
    ======================== */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-color: var(--bg);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background-color: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 36px 32px;
    }

    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo {
      min-width: 76px;
      height: 52px;
      padding: 0 18px;
      border-radius: 12px;
      background-color: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      border: 1px dashed var(--primary-border);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .login-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .password-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrap .input-control {
      padding-right: 42px;
    }

    .password-toggle {
      position: absolute;
      right: 10px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 6px;
    }

    .password-toggle:hover {
      color: var(--primary);
      background-color: var(--primary-light);
    }

    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      font-size: 13px;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
      cursor: pointer;
    }

    .checkbox-label input[type="checkbox"] {
      accent-color: var(--primary);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .link-btn {
      color: var(--primary);
      font-weight: 500;
      font-size: 13px;
    }

    .link-btn:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }

    .auth-switch {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .login-error {
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background-color: var(--danger-bg);
      color: var(--danger);
      font-size: 13px;
      border: 1px solid #FECACA;
    }

    .login-success {
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background-color: var(--success-bg);
      color: var(--success);
      font-size: 13px;
      border: 1px solid #BBF7D0;
    }

    /* ========================
       APP SHELL (SIDEBAR + MAIN)
    ======================== */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--white);
      border-right: 1px solid var(--border);
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      z-index: 40;
      transition: transform 0.2s ease;
    }

    .sidebar-header {
      height: var(--header-height);
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-logo {
      min-width: 44px;
      height: 34px;
      padding: 0 8px;
      border-radius: 8px;
      background-color: var(--primary);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .sidebar-brand-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .sidebar-brand-sub {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .nav-section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      padding: 10px 12px 4px;
    }

    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 13.5px;
      text-align: left;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .nav-item:hover {
      background-color: var(--bg);
      color: var(--text-main);
    }

    .nav-item.active {
      background-color: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
    }

    .nav-sub-group {
      padding-left: 28px;
      margin: 2px 0 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-sub-item {
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      text-align: left;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
    }

    .nav-sub-item:hover {
      color: var(--primary);
      background-color: var(--primary-light);
    }

    .nav-sub-item.active {
      color: var(--primary-dark);
      font-weight: 700;
      background-color: var(--primary-light);
    }

    .nav-expand-btn {
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      background-color: #FAF4F8;
      border: 1px dashed var(--primary-border);
      border-radius: var(--radius-sm);
      margin-top: 4px;
      padding: 7px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .nav-expand-btn:hover {
      background-color: var(--primary-light);
      color: var(--primary-dark);
      border-color: var(--primary);
    }

    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .nav-item.logout-btn {
      color: var(--danger);
    }

    .nav-item.logout-btn:hover {
      background-color: var(--danger-bg);
      color: var(--danger);
    }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(37, 34, 56, 0.35);
      z-index: 35;
    }

    /* ========================
       MAIN CONTENT & TOPBAR
    ======================== */
    .main-wrapper {
      flex: 1;
      margin-left: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: var(--header-height);
      background-color: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .mobile-menu-btn {
      display: none;
      padding: 8px;
      border-radius: var(--radius-sm);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .topbar-title-group h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-date {
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dropdown-container {
      position: relative;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background-color: var(--white);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .icon-btn:hover {
      background-color: var(--primary-light);
      border-color: var(--primary-border);
      color: var(--primary);
    }

    .notif-dot {
      position: absolute;
      top: 7px;
      right: 8px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 999px;
      background-color: var(--primary);
      color: var(--white);
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--white);
    }

    .profile-trigger {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 10px 5px 6px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background-color: var(--white);
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .profile-trigger:hover {
      background-color: var(--bg);
      border-color: var(--primary-border);
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background-color: var(--primary);
      color: var(--white);
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-info {
      text-align: left;
      line-height: 1.25;
    }

    .profile-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .profile-role {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 300px;
      background-color: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      z-index: 50;
      overflow: hidden;
    }

    .dropdown-menu.profile-menu {
      width: 220px;
    }

    .dropdown-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .dropdown-header strong {
      font-size: 13.5px;
      color: var(--text-main);
    }

    .notif-list {
      max-height: 290px;
      overflow-y: auto;
    }

    .notif-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-start;
      transition: background-color 0.12s ease;
    }

    .notif-item:last-child {
      border-bottom: none;
    }

    .notif-item.unread {
      background-color: #FCF7FA;
    }

    .notif-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-top: 6px;
      flex-shrink: 0;
      background-color: var(--primary);
    }

    .notif-item:not(.unread) .notif-indicator {
      background-color: var(--border);
    }

    .notif-text {
      font-size: 12.5px;
      color: var(--text-main);
    }

    .notif-time {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .menu-action {
      width: 100%;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-main);
      text-align: left;
    }

    .menu-action:hover {
      background-color: var(--bg);
      color: var(--primary);
    }

    .menu-action.danger {
      color: var(--danger);
      border-top: 1px solid var(--border);
    }

    .menu-action.danger:hover {
      background-color: var(--danger-bg);
    }

    /* ========================
       PAGE CONTENT & CARDS
    ======================== */
    .page-content {
      padding: 24px 28px 36px;
      flex: 1;
    }

    .page-header-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 20px;
    }

    .page-header-row h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }

    .page-header-row p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .card {
      background-color: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
    }

    .card-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .card-body {
      padding: 20px;
    }

    /* ========================
       DASHBOARD GRIDS & KPI
    ======================== */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .kpi-card {
      background-color: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 18px 20px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .kpi-label {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .kpi-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .kpi-meta {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    .kpi-meta .up {
      color: var(--success);
      font-weight: 600;
    }

    .kpi-meta .warn {
      color: var(--warning);
      font-weight: 600;
    }

    .kpi-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background-color: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 20px;
    }

    .analytics-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 18px;
      margin-bottom: 20px;
    }

    .bottom-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .tab-group {
      display: inline-flex;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 3px;
      gap: 2px;
    }

    .tab-btn {
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .tab-btn.active {
      background-color: var(--white);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .chart-box {
      width: 100%;
      overflow-x: auto;
    }

    .svg-chart {
      width: 100%;
      height: 220px;
      display: block;
    }

    .bar-rect {
      transition: fill 0.15s ease, opacity 0.15s ease;
      cursor: pointer;
    }

    .bar-rect:hover {
      fill: var(--primary-dark);
    }

    /* Lists & Progress Bars */
    .rank-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .rank-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .rank-name {
      font-weight: 600;
      color: var(--text-main);
    }

    .rank-val {
      color: var(--text-secondary);
      font-size: 12.5px;
    }

    .progress-track {
      width: 100%;
      height: 7px;
      border-radius: 999px;
      background-color: var(--primary-light);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background-color: var(--primary);
    }

    .alert-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .alert-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background-color: var(--bg);
    }

    .inv-status-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .inv-stat-box {
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      text-align: center;
      background-color: var(--bg);
    }

    .inv-stat-box strong {
      display: block;
      font-size: 18px;
      color: var(--text-main);
    }

    .inv-stat-box span {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* ========================
       TABLES
    ======================== */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      background-color: #FDFBFC;
      white-space: nowrap;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13.5px;
      color: var(--text-main);
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: #FCF7FA;
    }

    /* ========================
       POINT OF SALE (POS)
    ======================== */
    .pos-layout {
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 20px;
      align-items: start;
    }

    .pos-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 220px;
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
    }

    .search-box .input-control {
      padding-left: 36px;
    }

    .category-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .cat-pill {
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid var(--border);
      background-color: var(--white);
      color: var(--text-secondary);
      transition: all 0.15s ease;
    }

    .cat-pill:hover {
      border-color: var(--primary-border);
      color: var(--primary);
    }

    .cat-pill.active {
      background-color: var(--primary);
      border-color: var(--primary);
      color: var(--white);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .product-card {
      background-color: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      min-height: 296px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .product-card:hover:not(.out-of-stock) {
      border-color: var(--primary-border);
      box-shadow: var(--shadow-md);
    }

    .product-card.out-of-stock {
      opacity: 0.72;
      background-color: #FAFAFC;
    }

    .product-thumb {
      height: 138px;
      border-radius: var(--radius-sm);
      background-color: var(--primary-light);
      color: var(--primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .product-thumb svg {
      width: 44px;
      height: 44px;
    }

    .product-cat-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      background-color: var(--white);
      color: var(--primary-dark);
      border: 1px solid var(--primary-border);
    }

    .product-name {
      font-size: 15.5px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.35;
    }

    .product-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 6px;
    }

    .product-price {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .product-card .btn {
      min-height: 48px;
      padding: 12px 16px;
      font-size: 14.5px;
      font-weight: 700;
      border-radius: 10px;
    }

    /* POS Cart Panel */
    .pos-cart-panel {
      position: sticky;
      top: calc(var(--header-height) + 20px);
    }

    .cart-items {
      max-height: 290px;
      overflow-y: auto;
      padding: 0 20px;
    }

    .cart-empty {
      padding: 36px 20px;
      text-align: center;
      color: var(--text-secondary);
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-item-info {
      min-width: 0;
      flex: 1;
    }

    .cart-item-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-item-unit {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .qty-stepper {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 7px;
      background-color: var(--bg);
    }

    .qty-btn {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: var(--text-main);
    }

    .qty-btn:hover:not(:disabled) {
      background-color: var(--primary-light);
      color: var(--primary);
    }

    .qty-val {
      min-width: 30px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .cart-line-total {
      min-width: 78px;
      text-align: right;
      font-weight: 700;
      font-size: 16px;
      font-variant-numeric: tabular-nums;
    }

    .remove-item-btn {
      color: var(--text-secondary);
      padding: 4px;
      border-radius: 6px;
    }

    .remove-item-btn:hover {
      color: var(--danger);
      background-color: var(--danger-bg);
    }

    .cart-summary {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background-color: #FDFBFC;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14.5px;
      color: var(--text-secondary);
      margin-bottom: 10px;
      font-variant-numeric: tabular-nums;
    }

    .summary-row .summary-sub-val {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-main);
    }

    .summary-row.total {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      margin-bottom: 0;
    }

    .summary-total-val {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary-dark);
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .payment-section {
      padding: 16px 20px 20px;
      border-top: 1px solid var(--border);
    }

    .pos-cash-input {
      font-size: 20px;
      font-weight: 700;
      padding: 10px 14px;
      font-variant-numeric: tabular-nums;
    }

    .pos-cash-input::placeholder {
      font-size: 14px;
      font-weight: 400;
    }

    .quick-cash-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0 14px;
    }

    .quick-cash-btn {
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: var(--text-main);
    }

    .quick-cash-btn:hover {
      border-color: var(--primary);
      background-color: var(--primary-light);
      color: var(--primary-dark);
    }

    .change-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background-color: var(--primary-light);
      color: var(--primary-dark);
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 14px;
    }

    .change-amount-val {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
    }

    .change-box.insufficient {
      background-color: var(--danger-bg);
      color: var(--danger);
    }

    .pos-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .pos-mode-bar {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background-color: #FDFBFC;
    }

    .pos-mode-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .pos-qr-top-wrap {
      padding: 16px 20px 4px;
    }

    .pos-qr-top-wrap .pos-qr-hero {
      margin-bottom: 0;
    }

    .pos-mode-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 12px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      transition: all 0.15s ease;
    }

    .pos-mode-btn:hover {
      color: var(--text-main);
    }

    .pos-mode-btn.active {
      background-color: var(--primary);
      color: var(--white);
      box-shadow: var(--shadow-sm);
    }

    .pos-numpad-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 12px 0 14px;
    }

    .numpad-key {
      height: 68px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: var(--text-main);
      font-size: 23px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.12s ease, border-color 0.12s ease, transform 0.08s ease;
    }

    .numpad-key:hover:not(:disabled) {
      background-color: var(--primary-light);
      border-color: var(--primary-border);
      color: var(--primary-dark);
    }

    .numpad-key:active:not(:disabled) {
      transform: scale(0.97);
    }

    .numpad-key.key-action {
      font-size: 15px;
      font-weight: 600;
      background-color: var(--white);
    }

    .numpad-key.key-accent {
      background-color: var(--primary-light);
      border-color: var(--primary-border);
      color: var(--primary-dark);
      font-size: 15px;
    }

    .numpad-key:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .pos-qr-hero {
      border: 2px dashed var(--primary-border);
      background-color: var(--primary-light);
      border-radius: var(--radius-md);
      min-height: 360px;
      padding: 44px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 14px;
    }

    .pos-qr-hero-icon {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      background-color: var(--primary);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
    }

    .pos-qr-hero h4 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }

    .pos-qr-hero p {
      font-size: 14px;
      color: var(--text-secondary);
      max-width: 280px;
    }

    .btn-qr-massive {
      width: 100%;
      min-height: 68px;
      padding: 20px 24px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 12px;
    }

    .cart-header-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .scanned-customer-bar {
      padding: 10px 20px;
      background-color: var(--primary-light);
      border-bottom: 1px solid var(--primary-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12.5px;
      color: var(--primary-dark);
    }

    .qr-viewfinder {
      position: relative;
      height: 190px;
      border-radius: var(--radius-md);
      background-color: #1A1218;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--white);
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }

    .qr-viewfinder video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .qr-reticle {
      position: relative;
      z-index: 2;
      width: 126px;
      height: 126px;
      border: 2px dashed rgba(255, 255, 255, 0.75);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(79, 0, 59, 0.18);
    }

    .qr-status-text {
      position: relative;
      z-index: 2;
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.85);
    }

    .qr-quick-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .qr-sample-btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background-color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      text-align: left;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .qr-sample-btn:hover {
      border-color: var(--primary-border);
      background-color: var(--primary-light);
      color: var(--primary-dark);
    }

    /* ========================
       MODALS & RECEIPT
    ======================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(37, 34, 56, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-card {
      width: 100%;
      max-width: 460px;
      background-color: var(--white);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h3 {
      font-size: 16px;
      font-weight: 700;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background-color: #FDFBFC;
    }

    .receipt-paper {
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      padding: 20px;
      background-color: var(--white);
      font-size: 13px;
    }

    .receipt-head {
      text-align: center;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .receipt-head h4 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }

    .receipt-meta {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .receipt-items {
      border-top: 1px dashed var(--border);
      border-bottom: 1px dashed var(--border);
      padding: 10px 0;
      margin: 10px 0;
    }

    .receipt-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      gap: 8px;
    }

    .receipt-line:last-child {
      margin-bottom: 0;
    }

    .receipt-totals .receipt-line.grand {
      font-weight: 700;
      font-size: 15px;
      color: var(--primary-dark);
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }

    .receipt-success-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background-color: var(--success-bg);
      color: var(--success);
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 14px;
    }

    /* ========================
       TOAST
    ======================== */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 120;
    }

    .toast {
      background-color: var(--text-main);
      color: var(--white);
      padding: 11px 16px;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-lg);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 240px;
      max-width: 360px;
    }

    .toast.success {
      border-left: 4px solid var(--success);
    }

    .toast.error {
      border-left: 4px solid var(--danger);
    }

    .toast.info {
      border-left: 4px solid var(--primary);
    }

    /* ========================
       SETTINGS / PLACEHOLDER EXTRAS
    ======================== */
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .toolbar-inline {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    /* ========================
       LOGIN ROLE SWITCH & STUDENT BROWSE SHELL
    ======================== */
    .login-role-pills {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 18px;
    }

    .login-role-pill {
      padding: 8px 10px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      transition: all 0.15s ease;
    }

    .login-role-pill:hover {
      color: var(--text-main);
    }

    .login-role-pill.active {
      background-color: var(--primary);
      color: var(--white);
      box-shadow: var(--shadow-sm);
    }

    .student-shell {
      min-height: 100vh;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
    }

    .student-topbar {
      height: 70px;
      background-color: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .student-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .student-brand-logo {
      padding: 6px 12px;
      border-radius: 9px;
      background-color: var(--primary);
      color: var(--white);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .student-brand-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .student-brand-sub {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .student-topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .student-user-pill {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 5px 12px 5px 6px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background-color: var(--bg);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .student-container {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 28px 24px 48px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .student-hero-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .student-hero-head h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.015em;
    }

    .student-hero-head p {
      font-size: 13.5px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .floor-selector-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .floor-card {
      text-align: left;
      background-color: var(--white);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
    }

    .floor-card:hover {
      border-color: var(--primary-border);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .floor-card.active {
      border-color: var(--primary);
      background-color: var(--primary-light);
      box-shadow: var(--shadow-md);
    }

    .floor-badge {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background-color: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .floor-card.active .floor-badge {
      background-color: var(--primary);
      color: var(--white);
      border-color: var(--primary);
    }

    .floor-card-body {
      min-width: 0;
      flex: 1;
    }

    .floor-card-title {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 3px;
    }

    .floor-card-desc {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .floor-card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .student-toolbar {
      background-color: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      box-shadow: var(--shadow-sm);
    }

    .student-search-wrap {
      flex: 1 1 260px;
      max-width: 400px;
      position: relative;
    }

    .student-search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .student-search-wrap input {
      padding-left: 40px;
    }

    .student-product-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .student-product-card {
      background-color: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .student-product-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary-border);
      box-shadow: var(--shadow-md);
    }

    .student-product-card.out {
      opacity: 0.72;
    }

    .student-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);

    ======================== */

        grid-template-columns: repeat(2, minmax(0, 1fr));

        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .student-product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .pos-layout {
        grid-template-columns: 1.25fr 1fr;
      }

    @media (max-width: 960px) {

        transform: translateX(-100%);

        transform: translateX(0);
      }
      .sidebar-backdrop.open {
        display: block;
      }
      .main-wrapper {
        margin-left: 0;
      }
      .mobile-menu-btn {
        display: inline-flex;
      }
      .charts-grid,
      .analytics-grid,
      .bottom-grid,
      .pos-layout,
      .settings-grid,
      .floor-selector-grid {
        grid-template-columns: 1fr;
      }
      .pos-cart-panel {
        position: static;
      }

      .topbar,
      .student-topbar {
        padding: 0 16px;

      .page-content,
      .student-container {
        padding: 16px;
      }
      .kpi-grid,
      .product-grid,
      .student-product-grid {
        grid-template-columns: 1fr;
      }
      .profile-info,
      .student-user-pill {
        display: none;
      }

    ======================== */
    .template-paper {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 32px 36px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;

    .template-header {
      border-bottom: 2px solid var(--primary);
      padding-bottom: 16px;
      margin-bottom: 20px;

      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
    }

    .template-title {
      font-size: 19px;
      font-weight: 800;
      color: var(--primary-dark);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .template-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .template-meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 12px 16px;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      font-size: 12.5px;
    }

    .template-sign-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 32px;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px dashed var(--border);
    }

    .sign-box {
      border-top: 1px solid var(--text-main);
      padding-top: 6px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .sign-role {
      font-size: 11.5px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .prep-schematic {
      background-color: #FAF9FB;
      border: 2px dashed var(--primary-border);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .prep-zone-box {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .prep-zone-box.highlight {
      border-color: var(--primary);
      background-color: #FDF9FC;
    }

    @media (max-width: 960px) {
      .template-meta-grid,
      .prep-schematic {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .template-paper {
        padding: 18px;
      }
      .template-meta-grid,
      .template-sign-grid,
      .prep-schematic {
        grid-template-columns: 1fr;
      }
    }

    /* ========================

    ======================== */
    @media print {

        left: 0;

      // ==========================================
      // HELPERS
      // ==========================================
      function formatCurrency(val) {
        return '₱' + Number(val).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function showToast(message, type = 'info') {
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = message;
        toastContainer.appendChild(toast);
        setTimeout(() => {
          toast.remove();
        }, 3200);
      }

      function openModal(title, bodyHtml, footerHtml) {
        modalTitle.textContent = title;
        modalBody.innerHTML = bodyHtml;
        modalFooter.innerHTML = footerHtml || '';
        modalOverlay.classList.remove('hidden');
      }

      function closeModal() {
        if (state.activeQrStream) {
          state.activeQrStream.getTracks().forEach((track) => track.stop());
          state.activeQrStream = null;
        }
        modalOverlay.classList.add('hidden');
      }

      function getStockStatus(stock) {
        if (stock <= 0) return { label: 'Out of Stock', badgeClass: 'badge-danger' };
        if (stock <= state.canteenSettings.lowStockThreshold) return { label: `Low Stock (${stock})`, badgeClass: 'badge-warning' };
        return { label: `In Stock (${stock})`, badgeClass: 'badge-success' };
      }

      function getCategorySvg(category) {
        const icons = {
          Meals: '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
          Snacks: '<path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/>',
          Drinks: '<path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/>',
          Desserts: '<path d="M12 2a4 4 0 0 0-4 4v2h8V6a4 4 0 0 0-4-4Z"/><path d="M4 10h16l-1.5 9a2 2 0 0 1-2 1.7H7.5a2 2 0 0 1-2-1.7L4 10Z"/>'
        };
        return `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[category] || icons.Meals}</svg>`;
      }

      function updateDateDisplay() {
        const now = new Date();
        const formatted = now.toLocaleDateString('en-US', {
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
        currentDateDisplay.textContent = formatted;
        if (studentDateDisplay) {
          studentDateDisplay.textContent = `Student Canteen Browser · ${formatted}`;
        }
      }

      // ==========================================
      // AUTHENTICATION INTERACTIONS
      // ==========================================
      function bindPasswordToggle(btn, input) {
        btn.addEventListener('click', () => {
          const isPass = input.type === 'password';
          input.type = isPass ? 'text' : 'password';
          btn.setAttribute('aria-label', isPass ? 'Hide password' : 'Show password');
          btn.innerHTML = isPass
            ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
            : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
        });
      }

      bindPasswordToggle(togglePasswordBtn, loginPassword);
      bindPasswordToggle(toggleRegPasswordBtn, document.getElementById('reg-password'));

      showRegisterBtn.addEventListener('click', () => {
        loginError.classList.add('hidden');
        loginSuccess.classList.add('hidden');
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
      });

      showLoginBtn.addEventListener('click', () => {
        loginError.classList.add('hidden');
        registerForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
      });

      forgotPasswordBtn.addEventListener('click', () => {
        openModal(
          'Password Recovery',
          `<p style="color: var(--text-secondary); margin-bottom: 12px;">Enter your JMCFI email or contact the system administrator to reset your password.</p>
           <div class="form-group" style="margin-bottom:0;">
             <label class="form-label" for="reset-email">Email Address</label>
             <input type="email" id="reset-email" class="input-control" placeholder="name@jmcfi.edu.ph" />
           </div>`,
          `<button type="button" class="btn btn-secondary" id="reset-cancel-btn">Cancel</button>
           <button type="button" class="btn btn-primary" id="reset-send-btn">Send Reset Link</button>`
        );
        document.getElementById('reset-cancel-btn').addEventListener('click', closeModal);
        document.getElementById('reset-send-btn').addEventListener('click', () => {
          closeModal();
          showToast('Password recovery request submitted.', 'info');
        });
      });

      registerForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const fullName = document.getElementById('reg-fullname').value.trim();
        const username = document.getElementById('reg-username').value.trim();
        const role = document.getElementById('reg-role').value;
        const pass = document.getElementById('reg-password').value;
        const confirm = document.getElementById('reg-confirm').value;

        loginSuccess.classList.add('hidden');

        if (!fullName || !username || !pass || !confirm) {
          loginError.textContent = 'Please complete all registration fields.';
          loginError.classList.remove('hidden');
          return;
        }
        if (pass !== confirm) {
          loginError.textContent = 'Passwords do not match.';
          loginError.classList.remove('hidden');
          return;
        }

        const nextId = 'USR-' + String(state.users.length + 1).padStart(2, '0');
        state.credentials[username.toLowerCase()] = pass;
        state.userRoles[username.toLowerCase()] = role === 'Student' ? 'student' : 'admin';
        state.users.unshift({
          id: nextId,
          name: fullName,
          email: username,
          role,
          lastActive: 'Just registered',
          status: 'Active'
        });

        loginError.classList.add('hidden');
        registerForm.reset();
        registerForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
        loginUsername.value = username;
        loginPassword.value = '';
        loginSuccess.textContent = `Account registered for ${fullName}. You can now log in.`;
        loginSuccess.classList.remove('hidden');
        showToast('Registration successful!', 'success');
      });

      document.querySelectorAll('[data-quick-login]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const mode = btn.getAttribute('data-quick-login');
          document.querySelectorAll('[data-quick-login]').forEach((b) => {
            b.classList.toggle('active', b === btn);
          });
          loginError.classList.add('hidden');
          loginSuccess.classList.add('hidden');
          if (mode === 'student') {
            loginUsername.value = 'student';
            loginPassword.value = 'student';
          } else {
            loginUsername.value = 'admin';
            loginPassword.value = 'admin';
          }
        });
      });

      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const userVal = loginUsername.value.trim();
        const passVal = loginPassword.value.trim();

        loginSuccess.classList.add('hidden');

        if (!userVal || !passVal) {
          loginError.textContent = 'Please enter both username/email and password.';
          loginError.classList.remove('hidden');
          return;
        }

        const key = userVal.toLowerCase();
        if (state.credentials[key] !== passVal) {
          loginError.textContent = 'Invalid username or password.';
          loginError.classList.remove('hidden');
          return;
        }

        loginError.classList.add('hidden');
        state.isAuthenticated = true;
        state.currentUserRole = state.userRoles[key] || 'admin';
        loginView.classList.add('hidden');
        updateDateDisplay();

        if (state.currentUserRole === 'student') {
          appShell.classList.add('hidden');
          studentShell.classList.remove('hidden');
          state.studentActiveNav = 'floor-4th';
          state.studentFloor = '4th';
          state.studentCategory = 'All';
          state.studentSearch = '';
          studentUserLabel.textContent = key === 'student' ? 'JMCFI Student' : userVal;
          renderStudentSidebar();
          renderStudentContent();
          showToast('Signed in to Student Canteen Portal', 'success');
        } else {
          studentShell.classList.add('hidden');
          appShell.classList.remove('hidden');
          state.activeModule = 'dashboard';
          renderSidebar();
          renderNotifications();
          renderActiveModule();
          showToast('Signed in as Administrator', 'success');
        }
      });

      function closeStudentMobileSidebar() {
        studentSidebar.classList.remove('open');
        studentSidebarBackdrop.classList.remove('open');
      }

      function handleLogout() {
        state.isAuthenticated = false;
        closeDropdowns();
        closeMobileSidebar();
        closeStudentMobileSidebar();
        appShell.classList.add('hidden');
        studentShell.classList.add('hidden');
        loginView.classList.remove('hidden');
        showToast('You have been logged out.', 'info');
      }

      document.getElementById('sidebar-logout-btn').addEventListener('click', handleLogout);
      document.getElementById('profile-logout-btn').addEventListener('click', handleLogout);
      document.getElementById('student-logout-btn').addEventListener('click', handleLogout);
      document.getElementById('student-sidebar-logout-btn').addEventListener('click', handleLogout);

      studentMobileMenuBtn.addEventListener('click', () => {
        studentSidebar.classList.toggle('open');
        studentSidebarBackdrop.classList.toggle('open');
      });
      studentSidebarBackdrop.addEventListener('click', closeStudentMobileSidebar);

      // ==========================================
      // STUDENT PORTAL NAVIGATION & VIEWS
      // ==========================================
      function renderStudentSidebar() {
        let currentSection = '';
        let html = '';

        STUDENT_NAV_ITEMS.forEach((item) => {
          if (item.section !== currentSection) {
            currentSection = item.section;
            html += `<div class="nav-section-label">${escapeHtml(currentSection)}</div>`;
          }
          const isFloorActive = state.studentActiveNav === item.id;
          const activeClass = isFloorActive && state.studentLocationStore === 'All' ? 'active' : (isFloorActive && !item.subPlaces ? 'active' : '');
          html += `
            <button type="button" class="nav-item ${activeClass}" data-student-nav="${item.id}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                ${item.icon}
              </svg>
              <span>${escapeHtml(item.label)}</span>
            </button>
          `;

          if (item.subPlaces && item.subPlaces.length > 0) {
            html += `<div class="nav-sub-group">`;
            item.subPlaces.forEach((place) => {
              const isSubActive = isFloorActive && state.studentLocationStore === place;
              html += `
                <button type="button" class="nav-sub-item ${isSubActive ? 'active' : ''}" data-student-floor="${item.floor}" data-student-sub-place="${escapeHtml(place)}">
                  <span style="opacity: 0.55; font-size:11px;">↳</span>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                  <span>${escapeHtml(place)}</span>
                </button>
              `;
            });
            html += `</div>`;
          }
        });

        studentSidebarNav.innerHTML = html;
      }

      function navigateToStudent(navId) {
        state.studentActiveNav = navId;
        if (navId === 'floor-4th') state.studentFloor = '4th';
        if (navId === 'floor-3rd') state.studentFloor = '3rd';
        if (navId === 'floor-2nd') state.studentFloor = '2nd';
        renderStudentSidebar();
        renderStudentContent();
        closeStudentMobileSidebar();
      }

      studentSidebarNav.addEventListener('click', (e) => {
        const subBtn = e.target.closest('[data-student-sub-place]');
        if (subBtn) {
          const floor = subBtn.getAttribute('data-student-floor');
          const place = subBtn.getAttribute('data-student-sub-place');
          state.studentFloor = floor;
          state.studentActiveNav = `floor-${floor}`;
          state.studentLocationStore = place;
          renderStudentSidebar();
          renderStudentContent();
          closeStudentMobileSidebar();
          return;
        }

        const btn = e.target.closest('[data-student-nav]');

      // ==========================================
      // SVG CHARTS RENDERER (PURPLE THEME)
      // ==========================================
      function buildBarChartSvg(series, isCurrency = true) {
        const width = 520;
        const height = 210;
        const padLeft = 48;
        const padRight = 16;
        const padTop = 20;
        const padBottom = 30;
        const chartW = width - padLeft - padRight;
        const chartH = height - padTop - padBottom;
        const maxVal = Math.max(...series.map((d) => d.value), 1) * 1.15;

        const gridLines = [0, 0.25, 0.5, 0.75, 1].map((ratio) => {
          const y = padTop + chartH - chartH * ratio;
          const val = Math.round(maxVal * ratio);
          const label = val >= 1000 ? (val / 1000).toFixed(val % 1000 === 0 ? 0 : 1) + 'k' : val;
          return `
            <line x1="${padLeft}" y1="${y}" x2="${width - padRight}" y2="${y}" stroke="#EAE4E9" stroke-dasharray="3 3" />
            <text x="${padLeft - 8}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="#7A6C77">${isCurrency ? '₱' + label : label}</text>
          `;
        }).join('');

        const step = chartW / series.length;
        const barW = Math.min(34, step * 0.54);

        const bars = series.map((d, i) => {
          const barH = Math.max(4, (d.value / maxVal) * chartH);
          const x = padLeft + i * step + (step - barW) / 2;
          const y = padTop + chartH - barH;
          const formatted = isCurrency ? formatCurrency(d.value) : d.value;
          return `
            <g>
              <rect class="bar-rect" x="${x}" y="${y}" width="${barW}" height="${barH}" rx="5" fill="#4F003B">
                <title>${escapeHtml(d.label)}: ${formatted}</title>
              </rect>
              <text x="${x + barW / 2}" y="${height - 10}" text-anchor="middle" font-size="11" fill="#7A6C77">${escapeHtml(d.label)}</text>
            </g>
          `;
        }).join('');

        return `
          <svg class="svg-chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">
            ${gridLines}
            ${bars}
          </svg>
        `;
      }

            if (key === 'clear') {
              current = '';
            } else if (key === 'back') {
              current = current.slice(0, -1);
            } else if (key === '.') {
              if (!current.includes('.')) {
                current = (current || '0') + '.';
              }
            } else if (key === '00') {
              if (current !== '' && current !== '0') {
                current += '00';
              } else {
                current = '0';
              }
            } else {
              current = current === '0' ? key : current + key;
            }
            state.amountReceived = current;
            if (amountInput) amountInput.value = current;
            updatePosPaymentUI();

        });

      function updatePosPaymentUI() {
        const total = state.cart.reduce((sum, item) => sum + item.price * item.qty, 0);
        const receivedNum = parseFloat(state.amountReceived);
        const hasValid = !isNaN(receivedNum) && state.amountReceived !== '';
        const change = hasValid ? receivedNum - total : 0;

        const changeBox = pageContent.querySelector('.change-box');
        const changeDisplay = document.getElementById('pos-change-display');
        const completeBtn = document.getElementById('complete-txn-btn');
        const cancelBtn = document.getElementById('cancel-txn-btn');

        if (changeBox && changeDisplay) {
          if (hasValid && change < 0) {
            changeBox.classList.add('insufficient');
            changeBox.firstElementChild.textContent = 'Insufficient Amount';
            changeDisplay.textContent = formatCurrency(Math.abs(change));
          } else {
            changeBox.classList.remove('insufficient');
            changeBox.firstElementChild.textContent = 'Change';
            changeDisplay.textContent = formatCurrency(hasValid ? change : 0);
          }
        }

        if (completeBtn) {
          completeBtn.disabled = !(state.cart.length > 0 && hasValid && receivedNum >= total);
        }
        if (cancelBtn) {
          cancelBtn.disabled = state.cart.length === 0 && !state.amountReceived;
        }
      }

      function addToCart(productId) {
        const product = state.products.find((p) => p.id === productId);
        if (!product || product.stock <= 0) return;

        const existing = state.cart.find((item) => item.id === productId);
        if (existing) {
          if (existing.qty >= product.stock) {
            showToast(`Only ${product.stock} left in stock.`, 'error');
            return;
          }
          existing.qty += 1;
        } else {
          state.cart.push({
            id: product.id,
            name: product.name,
            price: product.price,
            qty: 1
          });
        }
        renderPOS();
      }

      function updateCartQty(productId, delta) {
        const item = state.cart.find((c) => c.id === productId);
        const product = state.products.find((p) => p.id === productId);
        if (!item) return;

        const nextQty = item.qty + delta;
        if (nextQty <= 0) {
          state.cart = state.cart.filter((c) => c.id !== productId);
        } else if (product && nextQty <= product.stock) {
          item.qty = nextQty;
        }
        renderPOS();
      }

      function removeFromCart(productId) {
        state.cart = state.cart.filter((c) => c.id !== productId);
        renderPOS();
      }

      function completeTransaction() {
        const subtotal = state.cart.reduce((sum, item) => sum + item.price * item.qty, 0);
        const total = subtotal;
        const received = parseFloat(state.amountReceived);
        if (state.cart.length === 0 || isNaN(received) || received < total) return;

        const change = received - total;

        // Deduct stock and increment units sold
        state.cart.forEach((cartItem) => {
          const prod = state.products.find((p) => p.id === cartItem.id);
          if (prod) {
            prod.stock = Math.max(0, prod.stock - cartItem.qty);
            prod.sold += cartItem.qty;
          }
        });

        const nextSeq = 46 + state.transactions.filter((t) => parseInt(t.id.split('-').pop(), 10) > 45).length;
        const txnId = 'TXN-2026-' + String(nextSeq).padStart(4, '0');
        const now = new Date();
        const dateTimeStr = now.toLocaleString('en-US', {
          month: 'short',
          day: 'numeric',
          year: 'numeric',
          hour: 'numeric',
          minute: '2-digit',
          hour12: true
        });
        const timeOnlyStr = now.toLocaleTimeString('en-US', {
          hour: 'numeric',
          minute: '2-digit',
          hour12: true
        });

        const receipt = {
          id: txnId,
          dateTime: dateTimeStr,
          customer: state.scannedCustomer || 'Walk-in Customer',
          items: state.cart.map((c) => ({ ...c })),
          subtotal,
          total,
          received,
          change
        };

        state.transactions.unshift({
          id: txnId,
          time: timeOnlyStr,
          itemsCount: state.cart.reduce((s, i) => s + i.qty, 0),
          summary: state.cart.map((c) => `${c.name} (${c.qty})`).join(', '),
          total,
          received,
          change,
          cashier: 'Administrator'
        });

        state.lastReceipt = receipt;
        state.cart = [];
        state.amountReceived = '';
        state.scannedCustomer = null;

        renderPOS();
        showToast(`Transaction ${txnId} completed!`, 'success');
        showReceiptModal(receipt, true);
      }

      function openQrScannerModal() {
        const bodyHtml = `
          <div class="qr-viewfinder" id="qr-viewfinder">
            <video id="qr-video-preview" class="hidden" autoplay playsinline muted></video>
            <div class="qr-reticle">
              <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.5">

              </svg>

            <span style="font-size:12px; font-weight:600; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.04em;">Quick Sample Scans</span>
            <button type="button" id="qr-camera-btn" class="link-btn" style="font-size:12px;">Enable Camera</button>
          </div>

          <div class="qr-quick-list">
            <button type="button" class="qr-sample-btn" data-qr-sample="STU-2026-019">
              <span><strong>Student ID QR:</strong> A. Bautista (BSIT-3A)</span>
              <span class="badge badge-purple">Link ID</span>
            </button>
            <button type="button" class="qr-sample-btn" data-qr-sample="ORD-1042">
              <span><strong>Pre-Order QR:</strong> ORD-1042 (Pork Sisig x2, Calamansi x2)</span>
              <span class="badge badge-warning">Load Order</span>
            </button>
            <button type="button" class="qr-sample-btn" data-qr-sample="P001">
              <span><strong>Product QR:</strong> P001 — Chicken Adobo Rice Bowl</span>
              <span class="badge badge-success">+1 Cart</span>
            </button>
          </div>
        `;

        const footerHtml = `<button type="button" class="btn btn-secondary" id="qr-close-btn">Close</button>`;
        openModal('QR Code Scanner', bodyHtml, footerHtml);

        document.getElementById('qr-close-btn').addEventListener('click', closeModal);

        document.getElementById('qr-apply-btn').addEventListener('click', () => {
          const code = document.getElementById('qr-manual-input').value.trim();
          if (!code) {
            showToast('Enter or select a QR code first.', 'error');
            return;
          }
          processQrCodeValue(code);
        });

        document.getElementById('qr-manual-input').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('qr-apply-btn').click();
          }
        });

        modalBody.querySelectorAll('[data-qr-sample]').forEach((btn) => {
          btn.addEventListener('click', () => {
            processQrCodeValue(btn.getAttribute('data-qr-sample'));
          });
        });

        document.getElementById('qr-camera-btn').addEventListener('click', async () => {
          const videoEl = document.getElementById('qr-video-preview');
          const statusEl = document.getElementById('qr-status-text');
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            statusEl.textContent = 'Camera unavailable in this browser. Use quick scans below.';
            showToast('Camera API unavailable; use sample scans or manual code.', 'info');
            return;
          }
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            state.activeQrStream = stream;
            videoEl.srcObject = stream;
            videoEl.classList.remove('hidden');
            statusEl.textContent = 'Camera active — align QR code inside frame';
          } catch (err) {
            statusEl.textContent = 'Camera permission denied. Use quick scans below.';
            showToast('Camera access denied; use sample scans below.', 'info');

      function processQrCodeValue(rawCode) {
        const code = rawCode.trim().toUpperCase();

        if (code.startsWith('STU-') || code.startsWith('FAC-')) {
          state.scannedCustomer = code === 'STU-2026-019' ? 'A. Bautista (BSIT-3A)' : `JMCFI Member (${code})`;
          closeModal();
          renderPOS();
          showToast(`QR Linked: ${state.scannedCustomer}`, 'success');
          return;
        }

        if (code === 'ORD-1042' || code === 'ORD-1041') {
          const orderItems = code === 'ORD-1042'
            ? [{ id: 'P002', qty: 2 }, { id: 'P008', qty: 2 }]
            : [{ id: 'P001', qty: 1 }, { id: 'P010', qty: 1 }];
          const ord = state.orders.find((o) => o.id === code);
          state.scannedCustomer = ord ? ord.customer : code;

          orderItems.forEach(({ id, qty }) => {
            for (let i = 0; i < qty; i++) {
              addToCart(id);
            }
          });
          closeModal();
          renderPOS();
          showToast(`Loaded ${code} into cart.`, 'success');
          return;
        }

        const prod = state.products.find((p) => p.id.toUpperCase() === code || p.name.toUpperCase().includes(code));
        if (prod) {
          if (prod.stock <= 0) {
            showToast(`${prod.name} is out of stock.`, 'error');
            return;
          }
          addToCart(prod.id);
          closeModal();
          showToast(`Scanned ${prod.name} (+1)`, 'success');
          return;
        }

        showToast(`Unrecognized QR code: ${rawCode}`, 'error');
      }
