   </span>
   <button type="button" class="btn btn-secondary" id="dml-mark-all-btn">Mark All ✓</button>
   <button type="button" class="btn btn-secondary" id="dml-reset-btn">Clear Form</button>
   <button type="button" class="btn btn-secondary" id="dml-print-btn">Print Monitoring Log</button>
   <button type="button" class="btn btn-primary" id="dml-save-btn">Save Log Entry</button>
  </div>
  </div>

  <div class="template-paper" id="annex-monitoring-paper">
  <div class="annex-doc-top">
   <div class="annex-crest"><img src="jmcfi-logo.png" alt="JMCFI Logo" /></div>
   <div class="annex-org-text">
   <div class="annex-org-title">JOSE MARIA COLLEGE FOUNDATION, INC.</div>
   <div class="annex-org-sub">JMCFI-MealHub &middot; Canteen Operations</div>
   </div>
  </div>

  <div class="annex-banner">
   <h3>Daily Canteen Monitoring Log</h3>
   <p>JMCFI Canteen Operations</p>
  </div>

  <table class="annex-meta-table">
   <tbody>
   <tr>
   <td class="annex-meta-label">Date:</td>
   <td>
    <input type="date" id="dml-date" class="annex-inline-input" value="${escapeHtml(draft.date || '2026-11-19')}" />
   </td>
   </tr>
   <tr>
   <td class="annex-meta-label">Time of Inspection:</td>
   <td>
    <input type="text" id="dml-time" class="annex-inline-input" placeholder="e.g. 08:00 AM" value="${escapeHtml(draft.time || '')}" />
   </td>
   </tr>
   <tr>
   <td class="annex-meta-label">Conducted by (Name &amp; Position):</td>
   <td>
    <input type="text" id="dml-conducted" class="annex-inline-input" placeholder="Enter Name &amp; Position" value="${escapeHtml(draft.conductedBy || '')}" />
   </td>
   </tr>
   <tr>
   <td class="annex-meta-label">Canteen:</td>
   <td>
    <select id="dml-canteen" class="annex-inline-input">
    ${canteenOptions.map((c) => `<option value="${escapeHtml(c)}" ${draft.canteen === c ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
    </select>
   </td>
   </tr>
   </tbody>
  </table>

  <div class="table-wrap" style="margin-bottom: 18px;">
   <table class="annex-checklist-table">
   <thead>
   <tr>
    <th>CHECKLIST ITEM</th>
    <th>✓ / X</th>
    <th>Remarks</th>
   </tr>
   </thead>
   <tbody>
   ${checklistRowsHtml}
   </tbody>
   </table>
  </div>

  <table class="annex-notes-table">
   <tbody>
   <tr>
   <td class="annex-notes-label">Issues / Observations Noted:</td>
   <td>
    <textarea id="dml-issues" class="annex-inline-input" rows="2" placeholder="Record any observations, temperature deviations, or expired items pulled..." style="resize:vertical;">${escapeHtml(draft.issues || '')}</textarea>
   </td>
   </tr>
   <tr>
   <td class="annex-notes-label">Action Taken / Recommended:</td>
   <td>
    <textarea id="dml-action" class="annex-inline-input" rows="2" placeholder="Specify immediate corrective steps or recommendations..." style="resize:vertical;">${escapeHtml(draft.actionTaken || '')}</textarea>
   </td>
   </tr>
   </tbody>
  </table>

  <div class="template-sign-grid" style="margin-top: 24px; padding-top: 18px;">
   <div>
   <div style="text-align:center; font-style:italic; font-size:12px; color:var(--text-secondary); margin-bottom: 18px;">Prepared by (Canteen Supervisor)</div>
   <input type="text" id="dml-prep-by" class="annex-inline-input" placeholder="Printed Name" value="${escapeHtml(draft.preparedBy || '')}" style="text-align:center; font-weight:600;" />
   <div class="sign-box">
   <div class="sign-role">Signature over Printed Name</div>
   </div>
   <div style="margin-top:8px; display:flex; align-items:center; justify-content:center; gap:6px; font-size:12px; color:var(--text-secondary);">
   <span>Date:</span>
   <input type="text" id="dml-prep-date" class="annex-inline-input" placeholder="___________" value="${escapeHtml(draft.preparedDate || '')}" style="width:140px; border-bottom:1px solid var(--border); border-radius:0; padding:2px 6px; text-align:center;" />
   </div>
   </div>
   <div>
   <div style="text-align:center; font-style:italic; font-size:12px; color:var(--text-secondary); margin-bottom: 18px;">Noted by (VP for Administration)</div>
   <input type="text" id="dml-noted-by" class="annex-inline-input" placeholder="Printed Name" value="${escapeHtml(draft.notedBy || '')}" style="text-align:center; font-weight:600;" />
   <div class="sign-box">
   <div class="sign-role">Signature over Printed Name</div>
   </div>
   <div style="margin-top:8px; display:flex; align-items:center; justify-content:center; gap:6px; font-size:12px; color:var(--text-secondary);">
   <span>Date:</span>
   <input type="text" id="dml-noted-date" class="annex-inline-input" placeholder="___________" value="${escapeHtml(draft.notedDate || '')}" style="width:140px; border-bottom:1px solid var(--border); border-radius:0; padding:2px 6px; text-align:center;" />
   </div>
   </div>
  </div>

  <div class="annex-doc-footer">
   <span>Daily Canteen Monitoring Log</span>
   <span>JMCFI | Canteen Manual of Operations</span>
  </div>
  </div>

  <div class="card no-print">
  <div class="card-header">
   <div>
   <div class="card-title">Saved Daily Canteen Monitoring Logs (${state.dailyMonitoringLogs.length})</div>
   <div class="card-subtitle">Click View / Load to open any saved monitoring log in the form above</div>
   </div>
  </div>
  <div class="table-wrap">
   <table>
   <thead>
   <tr>
    <th>Log ID</th>
    <th>Date &amp; Time</th>
    <th>Canteen</th>
    <th>Conducted By</th>
    <th>Compliance</th>
    <th>Issues / Action</th>
    <th>Action</th>
   </tr>
   </thead>
   <tbody>
   ${state.dailyMonitoringLogs.length === 0 ? `
    <tr><td colspan="7" style="text-align:center; color:var(--text-secondary); padding:24px;">No daily monitoring logs saved yet.</td></tr>
   ` : state.dailyMonitoringLogs.map((log) => `
    <tr>
    <td><strong>${escapeHtml(log.id)}</strong></td>
    <td>${escapeHtml(log.date)}<br><span style="font-size:11.5px; color:var(--text-secondary);">${escapeHtml(log.time)}</span></td>
    <td><span class="badge badge-purple">${escapeHtml(log.canteen)}</span></td>
    <td>${escapeHtml(log.conductedBy)}</td>
    <td><span class="badge ${log.passCount >= log.totalItems ? 'badge-success' : 'badge-warning'}">${log.passCount}/${log.totalItems} Passed</span></td>
    <td style="max-width: 240px; font-size:12px;">${escapeHtml(log.issues || 'None noted')}</td>
    <td>
    <button type="button" class="btn btn-secondary btn-sm" data-dml-load="${escapeHtml(log.id)}">View / Load</button>
    </td>
    </tr>
   `).join('')}
   </tbody>
   </table>
  </div>
  </div>
  `;

  const bindField = (id, key) => {
  const el = document.getElementById(id);
  if (el) {
  el.addEventListener('input', (e) => { draft[key] = e.target.value; });
  el.addEventListener('change', (e) => { draft[key] = e.target.value; });
  }
  };
  bindField('dml-date', 'date');
  bindField('dml-time', 'time');
  bindField('dml-conducted', 'conductedBy');
  bindField('dml-canteen', 'canteen');
  bindField('dml-issues', 'issues');
  bindField('dml-action', 'actionTaken');
  bindField('dml-prep-by', 'preparedBy');
  bindField('dml-prep-date', 'preparedDate');
  bindField('dml-noted-by', 'notedBy');
  bindField('dml-noted-date', 'notedDate');

  pageContent.querySelectorAll('[data-dml-remark]').forEach((input) => {
  input.addEventListener('input', (e) => {
  const itemId = e.target.getAttribute('data-dml-remark');
  if (!draft.items[itemId]) draft.items[itemId] = { status: '', remarks: '' };
  draft.items[itemId].remarks = e.target.value;
  });
  });

  const updateScoreBadge = () => {
  const pCount = allItems.filter((i) => draft.items[i.id]?.status === '✓').length;
  const fCount = allItems.filter((i) => draft.items[i.id]?.status === '✗').length;
  const badge = document.getElementById('dml-score-badge');
  if (badge) {
  badge.className = `badge ${fCount > 0 ? 'badge-warning' : 'badge-purple'}`;
  badge.textContent = `✓ ${pCount}/${totalItems} Passed${fCount > 0 ? ` · ${fCount} X` : ''}`;
  }
  };

  pageContent.querySelectorAll('[data-dml-item]').forEach((btn) => {
  btn.addEventListener('click', () => {
  const itemId = btn.getAttribute('data-dml-item');
  const val = btn.getAttribute('data-dml-val');
  if (!draft.items[itemId]) draft.items[itemId] = { status: '', remarks: '' };
  draft.items[itemId].status = draft.items[itemId].status === val ? '' : val;

  const rowButtons = btn.parentElement.querySelectorAll('[data-dml-item]');
  rowButtons.forEach((b) => {
   const bVal = b.getAttribute('data-dml-val');
   b.classList.toggle('active-pass', draft.items[itemId].status === '✓' && bVal === '✓');
   b.classList.toggle('active-fail', draft.items[itemId].status === '✗' && bVal === '✗');
  });
  updateScoreBadge();
  });
  });

  document.getElementById('dml-mark-all-btn').addEventListener('click', () => {
  allItems.forEach((i) => {
  if (!draft.items[i.id]) draft.items[i.id] = { status: '', remarks: '' };
  draft.items[i.id].status = '✓';
  });
  renderDailyMonitoringLogModule();
  showToast('All 20 monitoring checklist items marked compliant (✓).', 'info');
  });

  document.getElementById('dml-reset-btn').addEventListener('click', () => {
  state.dailyMonitoringDraft = createDefaultMonitoringDraft();
  renderDailyMonitoringLogModule();
  showToast('Daily monitoring log form cleared.', 'info');
  });

  document.getElementById('dml-print-btn').addEventListener('click', () => window.print());

  document.getElementById('dml-save-btn').addEventListener('click', () => {
  const pCount = allItems.filter((i) => draft.items[i.id]?.status === '✓').length;
  const nextId = 'DML-2026-' + String(119 + state.dailyMonitoringLogs.length).padStart(4, '0');
  const snapshotItems = {};
  allItems.forEach((i) => {
  snapshotItems[i.id] = { ...(draft.items[i.id] || { status: '', remarks: '' }) };
  });
  state.dailyMonitoringLogs.unshift({
  id: nextId,
  date: draft.date || '2026-11-19',
  time: draft.time || '08:00 AM',
  conductedBy: draft.conductedBy || state.currentUserName || 'Administrator',
  canteen: draft.canteen || '4th Floor Canteen',
  passCount: pCount,
  totalItems,
  issues: draft.issues || '',
  actionTaken: draft.actionTaken || '',
  preparedBy: draft.preparedBy || '',
  preparedDate: draft.preparedDate || '',
  notedBy: draft.notedBy || '',
  notedDate: draft.notedDate || '',
  items: snapshotItems
  });
  renderDailyMonitoringLogModule();
  showToast(`Daily Canteen Monitoring Log (${nextId}) saved.`, 'success');
  });

  pageContent.querySelectorAll('[data-dml-load]').forEach((btn) => {
  btn.addEventListener('click', () => {
  const logId = btn.getAttribute('data-dml-load');
  const found = state.dailyMonitoringLogs.find((l) => l.id === logId);
  if (!found) return;
  const freshDraft = createDefaultMonitoringDraft();
  freshDraft.date = found.date;
  freshDraft.time = found.time;
  freshDraft.conductedBy = found.conductedBy;
  freshDraft.canteen = found.canteen;
  freshDraft.issues = found.issues;
  freshDraft.actionTaken = found.actionTaken;
  freshDraft.preparedBy = found.preparedBy;
  freshDraft.preparedDate = found.preparedDate;
  freshDraft.notedBy = found.notedBy;
  freshDraft.notedDate = found.notedDate;
  allItems.forEach((i) => {
   if (found.items && found.items[i.id]) {
   freshDraft.items[i.id] = { ...found.items[i.id] };
   } else if (found.passCount === found.totalItems) {
   freshDraft.items[i.id] = { status: '✓', remarks: '' };
   }
  });
  state.dailyMonitoringDraft = freshDraft;
  renderDailyMonitoringLogModule();
  showToast(`Loaded log ${logId} into monitoring log form.`, 'info');
  });
  });
 }

 // Initialize Date on Load
 updateDateDisplay();
 })();
</script>
